[package]
name = "ne-funnel"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "《残响之河》L0-L5 六层漏斗框架（funnel.yaml 单一事实源 + 门禁 + 状态推进）"

[[bin]]
name = "ne-funnel"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
