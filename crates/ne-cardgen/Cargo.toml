[package]
name = "ne-cardgen"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ne-core = { path = "../ne-core" }
ne-engine = { path = "../ne-engine", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
tokio = { version = "1", features = ["full"] }
