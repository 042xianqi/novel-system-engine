[workspace]
resolver = "2"
members = [
    "crates/ne-core",
    "crates/ne-funnel",
    "crates/ne-db",
    "crates/ne-injection",
    "crates/ne-engine",
    "crates/ne-qc",
    "crates/ne-cardgen",
    "crates/ne-import",
    "crates/ne-mcp",
    "crates/ne-agent",
]

[workspace.package]
version = "0.0.22"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/042xianqi/novel-system"

[profile.release]
opt-level = 3
lto = "thin"
strip = true          # 单二进制分发：剥符号，减小体积
codegen-units = 1     # 更好的 LTO 效果（编译慢些，分发快）
