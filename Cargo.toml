[workspace]
resolver = "2"
members = [
    "crates/ne-core",
    "crates/ne-funnel",
    "crates/ne-db",
    "crates/ne-injection",
    "crates/ne-engine",
    "crates/ne-qc",
    "crates/ne-cardgen",
    "crates/ne-import",
    "crates/ne-mcp",
    "crates/ne-agent",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/042xianqi/novel-system"

[profile.release]
opt-level = 3
lto = "thin"
