<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>残响之河 · 创作台</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#2a2f3a;--fg:#d7dce5;--dim:#8b94a7;--acc:#5aa9e6;--warn:#e6b45a;--bad:#e66a6a;--ok:#5ad18a;--hdr:52px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    overscroll-behavior-y:none}
  /* ── 顶栏 ── */
  #top{position:sticky;top:0;z-index:30;height:var(--hdr);display:flex;align-items:center;gap:10px;
    padding:0 12px;padding-top:env(safe-area-inset-top);background:var(--panel);border-bottom:1px solid var(--line)}
  #burger{font-size:20px;line-height:1;padding:8px 10px;border-radius:8px;background:#22303f;color:var(--acc);border:1px solid var(--line);cursor:pointer}
  #title{font-weight:600;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #reload{font-size:13px;padding:7px 11px;border-radius:8px;background:#22303f;color:var(--acc);border:1px solid var(--line);cursor:pointer}
  /* ── 抽屉 ── */
  #drawer{position:fixed;inset:0 auto 0 0;width:min(78vw,290px);z-index:50;
    background:var(--panel);border-right:1px solid var(--line);padding:14px 12px;
    padding-top:calc(14px + env(safe-area-inset-top));transform:translateX(-102%);transition:transform .22s ease;overflow-y:auto}
  #drawer.open{transform:translateX(0)}
  #mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
  #mask.open{display:block}
  #drawer h1{font-size:15px;margin:2px 0 14px;color:var(--acc)}
  #drawer a{display:flex;align-items:center;gap:9px;padding:11px 12px;margin:2px 0;border-radius:9px;
    color:var(--fg);text-decoration:none;cursor:pointer;font-size:15px}
  #drawer a:active{background:#20242e}
  #drawer a.active{background:#22303f;color:var(--acc);font-weight:600}
  #drawer .sec{color:var(--dim);font-size:11.5px;margin:14px 4px 6px;letter-spacing:.08em}
  #drawer a .num{color:var(--dim);font-size:12px;flex:none}
  #drawer a.active .num{color:var(--acc)}
  /* ── 主内容 ── */
  main{padding:14px 13px calc(28px + env(safe-area-inset-bottom));max-width:100%;overflow-x:hidden}
  h2{font-size:17px;margin:0 0 12px}
  h3{font-size:14px;margin:18px 0 8px;color:var(--acc)}
  /* 进度条 */
  .bar{height:8px;background:#1b1f28;border-radius:5px;overflow:hidden;margin:8px 0 4px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#5aa9e6,#5ad18a);border-radius:5px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  .card .n{font-size:20px;color:var(--acc);font-weight:600;line-height:1.2}
  .card .l{color:var(--dim);font-size:11.5px;margin-top:3px}
  /* 条目 */
  .item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px}
  .item.tap{cursor:pointer}
  .item .r1{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
  .item .lay{background:#22303f;color:var(--acc);border-radius:5px;padding:1px 7px;font-size:11.5px;flex:none}
  .item .k{font-size:13px;color:var(--fg);font-weight:600;word-break:break-all}
  .item .t{font-size:12.5px;color:var(--dim);margin-bottom:7px;word-break:break-word}
  .item .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .flow{margin:9px 0 4px;border-left:2px solid var(--line);padding-left:11px}
  .flow .fx{display:flex;gap:8px;align-items:baseline;padding:2.5px 0;font-size:13px}
  .flow .fn{flex:none;width:19px;height:19px;border-radius:50%;background:#22303f;color:var(--acc);font-size:11px;text-align:center;line-height:19px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
  .dot.done{background:var(--ok)} .dot.todo{background:#3a4150}
  /* 故事正文渲染 */
  .story{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px 14px 14px;overflow-wrap:break-word}
  .story h2{font-size:16px;margin:16px 0 8px;color:var(--fg);border-left:3px solid var(--acc);padding-left:9px}
  .story h3{font-size:14px;margin:14px 0 6px;color:var(--acc)}
  .story h4{font-size:13.5px;margin:12px 0 5px;color:var(--fg)}
  .story p{margin:7px 0}
  .story ul,.story ol{margin:7px 0;padding-left:20px}
  .story li{margin:3px 0}
  .story blockquote{margin:9px 0;padding:6px 11px;border-left:2px solid var(--line);color:var(--dim);background:#13161c;border-radius:0 7px 7px 0}
  .story strong{color:#eef2f8}
  .story code{background:#12151b;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12.5px}
  .story table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px;display:block;overflow-x:auto}
  .story th,.story td{border:1px solid var(--line);padding:7px 9px;text-align:left;white-space:normal;min-width:72px}
  .story th{background:#1b1f28;color:var(--dim);font-weight:500}
  /* 控件 */
  input,select,textarea{background:#1b1f28;color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font:inherit;min-height:42px;max-width:100%}
  textarea{width:100%;min-height:190px;font-family:ui-monospace,monospace;white-space:pre;overflow-x:auto}
  button{background:#22303f;color:var(--acc);border:1px solid var(--line);border-radius:9px;padding:10px 14px;cursor:pointer;font:inherit;min-height:42px}
  button:active{background:#2a3b4f}
  button:disabled{opacity:.42;cursor:not-allowed}
  button.danger{color:var(--bad)}
  button.sm{padding:7px 11px;min-height:34px;font-size:12.5px}
  .muted{color:var(--dim);font-size:12px}
  .err{color:var(--bad)} .ok{color:var(--ok)} .warn{color:var(--warn)}
  .pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11.5px;border:1px solid var(--line)}
  .pill.on{color:#0f1115;background:var(--ok);border-color:var(--ok)}
  .pill.off{color:var(--dim)}
  .row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
  .box .k{color:var(--dim);font-size:11.5px}
  .box .v{font-size:13px;margin-top:3px;word-break:break-word}
  .box.next{border-color:#2f4a5f}
  .tab{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  /* 旧规则保留布局，但 display 改 visibility —— 否则 transform 过渡不生效 */
  #sheet{position:fixed;inset:0;z-index:60;overflow-y:auto;
    padding:14px 13px calc(24px + env(safe-area-inset-bottom));
    visibility:hidden;pointer-events:none}
  #sheet.open{visibility:visible;pointer-events:auto}
  #sheet .sh{position:sticky;top:0;display:flex;align-items:center;gap:10px;
    padding:10px 0 12px;background:rgba(15,17,21,.98);border-bottom:1px solid var(--line);margin-bottom:12px}
  #sheet .sh b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lbl{display:block;color:var(--dim);font-size:12px;margin:11px 0 5px}
  @media (min-width:760px){
    #top{height:auto;padding:12px 18px}
    #burger{display:none}
    #wrap{display:flex;min-height:100vh}
    #drawer{position:static;transform:none;width:226px;flex:none;transition:none}
    #mask{display:none!important}
    main{flex:1;padding:18px 22px;max-width:900px}
  }

  /* ══════════════════════════════════════════════════════════
     设计系统 v2（2026-10-17 UI 重构）
     · 统一圆角/阴影/过渡曲线
     · 按钮微交互（hover 放大 1.02 / active 按压 0.98 / 发光）
     · 危险操作渐变红、Loading spinner、禁用灰度
     · 弹层滑入 + 毛玻璃遮罩、页面淡入
     · 胶囊呼吸灯、进度条平滑填充、结果列表 stagger
     ══════════════════════════════════════════════════════════ */
  :root{
    /* 圆角 */
    --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:16px; --r-pill:999px;
    /* 阴影：三层递进（贴近真实的层次感） */
    --sh-1:0 1px 2px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.12);
    --sh-2:0 2px 6px rgba(0,0,0,.22), 0 4px 12px rgba(0,0,0,.16);
    --sh-3:0 4px 12px rgba(0,0,0,.28), 0 12px 32px rgba(0,0,0,.24);
    --sh-glow-acc:0 0 0 1px rgba(90,169,230,.35), 0 4px 16px rgba(90,169,230,.22);
    --sh-glow-bad:0 0 0 1px rgba(230,106,106,.40), 0 4px 16px rgba(230,106,106,.26);
    --sh-glow-ok:0 0 0 1px rgba(90,209,138,.35), 0 4px 16px rgba(90,209,138,.22);
    /* 过渡曲线：Material 的 standard easing，比 linear 高级得多 */
    --ease:cubic-bezier(.4,0,.2,1);
    --ease-out-back:cubic-bezier(.34,1.56,.64,1);
    --t-fast:140ms; --t-mid:220ms; --t-slow:320ms;
    /* 危险色（渐变用） */
    --bad-1:#8e1b1b; --bad-2:#c0392b;
    --ok-1:#1b5e20; --ok-2:#2e7d32;
    --wl-1:#7a5a12; --wl-2:#b8860b;
  }

  /* ── 等宽字体：编号、字数、ID 一律用 Monospace（极客感） ── */
  .mono, .item .k, .item .lay, .box .v code, code, pre,
  .nov-num, .nov-id { font-family:'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    font-variant-numeric:tabular-nums; letter-spacing:-.01em; }

  /* ── 按钮微交互 ── */
  button{
    border-radius:var(--r-md);
    transition:transform var(--t-fast) var(--ease),
               box-shadow var(--t-mid) var(--ease),
               background-color var(--t-mid) var(--ease),
               opacity var(--t-fast) var(--ease),
               border-color var(--t-mid) var(--ease);
    will-change:transform;
    position:relative;
    overflow:hidden;
  }
  @media (hover:hover){
    button:not(:disabled):hover{
      transform:scale(1.02) translateY(-1px);
      box-shadow:var(--sh-2), var(--sh-glow-acc);
      border-color:#3a5a75;
    }
  }
  button:not(:disabled):active{
    transform:scale(.98);
    box-shadow:var(--sh-1);
    transition-duration:70ms;
  }
  button:disabled{
    opacity:.42; cursor:not-allowed; filter:grayscale(.7);
    transform:none !important; box-shadow:none !important;
  }
  /* 主按钮（蓝） */
  button.primary{
    background:linear-gradient(135deg,#1e4a6d,#2b6690);
    color:#cfe6f7; border-color:#2f6f9e; font-weight:600;
  }
  @media (hover:hover){ button.primary:not(:disabled):hover{
    background:linear-gradient(135deg,#255a83,#327aab);
  }}
  /* 危险按钮（渐变深红 + 警示光） */
  button.warn, button.danger{
    background:linear-gradient(135deg, var(--bad-1), var(--bad-2));
    color:#ffdede; border-color:#a93226; font-weight:600;
    text-shadow:0 1px 2px rgba(0,0,0,.35);
  }
  @media (hover:hover){
    button.warn:not(:disabled):hover, button.danger:not(:disabled):hover{
      background:linear-gradient(135deg,#a52222,#d0453a);
      box-shadow:var(--sh-2), var(--sh-glow-bad);
      border-color:#d0453a;
    }
  }
  /* 成功按钮（渐变绿） */
  button.ok{
    background:linear-gradient(135deg, var(--ok-1), var(--ok-2));
    color:#dcf7e5; border-color:#2e7d32; font-weight:600;
  }
  @media (hover:hover){ button.ok:not(:disabled):hover{
    background:linear-gradient(135deg,#226b28,#37994a); box-shadow:var(--sh-2), var(--sh-glow-ok);
  }}
  /* 幽灵按钮（描边） */
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
  @media (hover:hover){ button.ghost:not(:disabled):hover{background:#1c222c;color:var(--fg);box-shadow:var(--sh-1)}}

  /* ── Loading spinner（按钮内） ── */
  @keyframes nov-spin{ to{transform:rotate(360deg)} }
  .nov-spinner{
    display:inline-block; width:14px; height:14px; vertical-align:-2px;
    border:2px solid currentColor; border-top-color:transparent; border-radius:50%;
    animation:nov-spin .72s linear infinite; margin-right:7px; opacity:.9;
  }
  button.nov-loading{ pointer-events:none; opacity:.78 }
  button.nov-loading::after{
    content:''; position:absolute; inset:0; border-radius:inherit;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);
    animation:nov-shimmer 1.1s infinite;
  }
  @keyframes nov-shimmer{ 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

  /* ── 卡片/面板统一圆角阴影 ── */
  .item, .box, .card, .story{
    border-radius:var(--r-lg);
    box-shadow:var(--sh-1);
    transition:box-shadow var(--t-mid) var(--ease),
               transform var(--t-mid) var(--ease),
               border-color var(--t-mid) var(--ease);
  }
  .item.tap{cursor:pointer}
  @media (hover:hover){
    .item.tap:hover{
      transform:translateY(-1px);
      box-shadow:var(--sh-2);
      border-color:#37414f;
    }
  }
  input, select, textarea{
    border-radius:var(--r-md);
    transition:border-color var(--t-mid) var(--ease), box-shadow var(--t-mid) var(--ease);
  }
  input:focus, select:focus, textarea:focus{
    outline:none; border-color:var(--acc);
    box-shadow:0 0 0 3px rgba(90,169,230,.16), var(--sh-1);
  }

  /* ── 弹层：从底部升起 + 毛玻璃遮罩 ── */
  #sheet{
    border-radius:var(--r-xl) var(--r-xl) 0 0;
    box-shadow:var(--sh-3);
    transform:translateY(100%);
    opacity:0;
    transition:transform var(--t-slow) var(--ease), opacity var(--t-mid) var(--ease);
    will-change:transform, opacity;
    background:rgba(15,17,21,.97);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
  }
  #sheet.open{ transform:translateY(0); opacity:1; visibility:visible; pointer-events:auto; }
  /* 桌面端：从右侧滑入（更像抽屉） */
  @media (min-width:760px){
    #sheet{
      inset:0 0 0 auto; width:min(560px,52vw);
      border-radius:var(--r-xl) 0 0 var(--r-xl);
      transform:translateX(100%);
    }
    #sheet.open{ transform:translateX(0); }
  }
  /* 半透明毛玻璃遮罩（贴在 sheet 后面） */
  #novMask{
    position:fixed; inset:0; z-index:59; display:none;
    background:rgba(6,8,11,.55);
    backdrop-filter:blur(6px) saturate(120%);
    -webkit-backdrop-filter:blur(6px) saturate(120%);
    opacity:0; transition:opacity var(--t-mid) var(--ease);
  }
  #novMask.open{ display:block; opacity:1; }

  /* ── 页面切换淡入 ── */
  @keyframes nov-fade-in{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
  main.nov-enter{ animation:nov-fade-in var(--t-mid) var(--ease) both; }

  /* ── 全局任务胶囊 ── */
  #novCapsule{
    position:fixed; right:14px; bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:75; display:none; align-items:center; gap:9px;
    padding:11px 15px; border-radius:var(--r-pill);
    background:linear-gradient(135deg,#1e2a38,#243448);
    border:1px solid #34495e; color:var(--fg);
    box-shadow:var(--sh-3); cursor:pointer;
    font-size:13.5px; font-weight:600;
    transition:transform var(--t-mid) var(--ease-out-back),
               box-shadow var(--t-mid) var(--ease),
               background var(--t-mid) var(--ease),
               opacity var(--t-mid) var(--ease);
    transform:translateY(14px) scale(.92); opacity:0;
    overflow:hidden;
  }
  #novCapsule.show{ display:flex; transform:translateY(0) scale(1); opacity:1; }
  @media (hover:hover){ #novCapsule:hover{ transform:translateY(-2px) scale(1.03); box-shadow:var(--sh-3), var(--sh-glow-acc);} }
  #novCapsule:active{ transform:scale(.97) }
  #novCapsule.running{ background:linear-gradient(135deg,#17334a,#1d4a68); border-color:#2f6f9e; }
  #novCapsule.done{ background:linear-gradient(135deg,var(--ok-1),var(--ok-2)); border-color:#43a047; color:#eafaef; }
  #novCapsule.bad{ background:linear-gradient(135deg,var(--bad-1),var(--bad-2)); border-color:#c0392b; color:#ffe6e6; }
  /* 呼吸灯 + 流动进度条 */
  #novCapsule .nov-dot{
    width:9px; height:9px; border-radius:50%; background:#7fd0ff; flex:none;
    animation:nov-breathe 1.5s var(--ease) infinite;
  }
  @keyframes nov-breathe{
    0%,100%{ opacity:.45; box-shadow:0 0 0 0 rgba(127,208,255,.55) }
    50%    { opacity:1;   box-shadow:0 0 0 6px rgba(127,208,255,0) }
  }
  #novCapsule .nov-flow{
    position:absolute; left:0; bottom:0; height:2.5px; width:100%;
    background:linear-gradient(90deg,transparent,rgba(127,208,255,.85),transparent);
    background-size:200% 100%;
    animation:nov-flow 1.4s linear infinite; display:none;
  }
  #novCapsule.running .nov-flow{ display:block }
  @keyframes nov-flow{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  #novCapsule .nov-cap-num{ font-family:monospace; opacity:.95 }

  /* ── 进度条（平滑填充） ── */
  .nov-prog{
    height:10px; background:#161a21; border-radius:var(--r-pill);
    overflow:hidden; margin:10px 0 6px; box-shadow:inset 0 1px 3px rgba(0,0,0,.4);
  }
  .nov-prog > i{
    display:block; height:100%; border-radius:var(--r-pill);
    background:linear-gradient(90deg,#3d8fd0,#5ad18a);
    transition:width 620ms var(--ease);
    box-shadow:0 0 12px rgba(90,209,138,.45);
    position:relative;
  }
  .nov-prog > i::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
    animation:nov-shimmer 1.8s infinite;
  }
  .nov-prog.indet > i{ width:38% !important; animation:nov-indet 1.5s var(--ease) infinite }
  @keyframes nov-indet{
    0%{ transform:translateX(-100%) } 100%{ transform:translateX(290%) }
  }

  /* ── 结果列表 stagger 入场 ── */
  @keyframes nov-rise{ from{opacity:0; transform:translateY(14px) scale(.985)} to{opacity:1; transform:none} }
  .nov-stagger > *{ animation:nov-rise 380ms var(--ease) both; }
  .nov-stagger > *:nth-child(1){animation-delay:0ms}
  .nov-stagger > *:nth-child(2){animation-delay:48ms}
  .nov-stagger > *:nth-child(3){animation-delay:96ms}
  .nov-stagger > *:nth-child(4){animation-delay:144ms}
  .nov-stagger > *:nth-child(5){animation-delay:192ms}
  .nov-stagger > *:nth-child(6){animation-delay:240ms}
  .nov-stagger > *:nth-child(7){animation-delay:288ms}
  .nov-stagger > *:nth-child(8){animation-delay:336ms}
  .nov-stagger > *:nth-child(9){animation-delay:384ms}
  .nov-stagger > *:nth-child(10){animation-delay:432ms}
  .nov-stagger > *:nth-child(n+11){animation-delay:470ms}

  /* ── 结果行 ── */
  .nov-res{
    display:flex; align-items:center; gap:9px; padding:8px 10px;
    border-radius:var(--r-sm); background:#141821; border:1px solid #232a35;
    margin-bottom:6px; font-size:13px;
    transition:background var(--t-mid) var(--ease), border-color var(--t-mid) var(--ease);
  }
  @media (hover:hover){ .nov-res:hover{ background:#181d28; border-color:#2f3a48 } }
  .nov-res .ic{ flex:none; font-size:14px; width:18px; text-align:center }
  .nov-res .cd{ font-family:monospace; font-size:12px; color:var(--acc); flex:none }
  .nov-res .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .nov-res .ch{ font-family:monospace; font-size:12px; color:var(--dim); flex:none }
  .nov-res.ok{ border-color:#24503a; background:#121a16 }
  .nov-res.fail{ border-color:#5a2626; background:#1a1315 }
  .nov-res.wait{ opacity:.62 }

  /* ── Toast：从底部浮起 + 渐隐 ── */
  @keyframes nov-toast-in{
    from{ opacity:0; transform:translate(-50%,18px) scale(.94) }
    to  { opacity:1; transform:translate(-50%,0) scale(1) }
  }
  @keyframes nov-toast-out{
    from{ opacity:1; transform:translate(-50%,0) scale(1) }
    to  { opacity:0; transform:translate(-50%,-10px) scale(.96) }
  }
  .nov-toast{
    position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom));
    z-index:99; font-size:13.5px; padding:11px 17px; border-radius:var(--r-md);
    max-width:90vw; text-align:center; box-shadow:var(--sh-3);
    animation:nov-toast-in var(--t-mid) var(--ease-out-back) both;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.09);
  }
  .nov-toast.out{ animation:nov-toast-out 240ms var(--ease) both }

  /* ── 锁条 ── */
  .nov-lockbar{
    border-radius:var(--r-lg); padding:13px 15px; margin:10px 0; cursor:pointer;
    box-shadow:var(--sh-2);
    transition:transform var(--t-fast) var(--ease), box-shadow var(--t-mid) var(--ease),
               background var(--t-mid) var(--ease);
    position:relative; overflow:hidden;
  }
  .nov-lockbar::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:rgba(255,255,255,.5);
  }
  @media (hover:hover){ .nov-lockbar:hover{ transform:translateY(-1px); box-shadow:var(--sh-3) } }
  .nov-lockbar:active{ transform:scale(.992) }
  .nov-lockbar.locked{ background:linear-gradient(135deg,#7f1717,#a8291f); border:1px solid #c0392b }
  .nov-lockbar.unlocked{ background:linear-gradient(135deg,#14532d,#1f7a3d); border:1px solid #2e7d32 }
  .nov-lockbar .t1{ font-weight:700; font-size:15px; color:#fff; display:flex; align-items:center; gap:8px }
  .nov-lockbar .t2{ font-size:12px; opacity:.92; margin-top:5px; color:#fff }

  /* ── 徽章 ── */
  .nov-badge{
    display:inline-flex; align-items:center; gap:5px;
    padding:2px 9px; border-radius:var(--r-pill); font-size:11.5px; font-weight:600;
    border:1px solid transparent; font-family:monospace;
  }
  .nov-badge.pend{ background:rgba(230,180,90,.14); color:var(--warn); border-color:rgba(230,180,90,.35) }
  .nov-badge.run{ background:rgba(90,169,230,.15); color:var(--acc); border-color:rgba(90,169,230,.38) }
  .nov-badge.done{ background:rgba(90,209,138,.14); color:var(--ok); border-color:rgba(90,209,138,.35) }
  .nov-badge.bad{ background:rgba(230,106,106,.14); color:var(--bad); border-color:rgba(230,106,106,.35) }

  /* 尊重用户的"减少动效"偏好 */
  @media (prefers-reduced-motion:reduce){
    *, *::before, *::after{
      animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
  }
</style>
</head>
<body>
<div id="top">

    <option>卷01</option><option>卷02</option><option>卷03</option><option>卷04</option><option>卷05</option>

  </select>

</div>
<div id="mask" onclick="toggleNav(false)"></div>
<div id="wrap">

  <main id="main"><p class="muted">加载中…</p></main>

<!-- 毛玻璃遮罩（弹层出现时渐显） -->
<div id="novMask" onclick="closeSheet()"></div>
<!-- 全局任务胶囊（右下角，任何页面常驻） -->

<div id="sheet">
  <div class="sh"><b id="shTitle">详情</b>

<script>
"use strict";
var main = document.getElementById('main');
var sheet = document.getElementById('sheet');
var CUR = 'home';
function h(x){ main.innerHTML = x; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'"'}[c]; }); }
function api(p, opt){
  return fetch(p, Object.assign({headers:{'Accept':'application/json'}}, opt||{}))
    .then(function(r){ if(!r.ok){ if(r.status===400||r.status===404) return r.json(); throw new Error('HTTP '+r.status+' '+p); } return r.json(); });
}
function jpost(p, b){ return api(p, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b)}); }
function jput(p, b){ return api(p, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b)}); }
function fail(e){ h('<h2>加载失败</h2><p class="err">'+esc(e.message||e)+'</p>'); }
function pid(on){ return on ? '<span class="pill on">已开锁</span>' : '<span class="pill off">未开锁</span>'; }
function toggleNav(force){
  var d = document.getElementById('drawer'), m = document.getElementById('mask');
  var want = (typeof force === 'boolean') ? force : !d.classList.contains('open');
  d.classList.toggle('open', want); m.classList.toggle('open', want);
}
function openSheet(t, body, foot){
  document.getElementById('shTitle').textContent = t;
  document.getElementById('shBody').innerHTML = body;
  document.getElementById('shFoot').innerHTML = foot || '';
  // 毛玻璃遮罩同步淡入（与 sheet 滑入同节奏）
  var mask = document.getElementById('novMask');
  if (mask) mask.classList.add('open');
  sheet.classList.add('open');
  sheet.scrollTop = 0;
  renderBackBtn();
}
function closeSheet(){
  sheet.classList.remove('open');
  var mask = document.getElementById('novMask');
  if (mask) mask.classList.remove('open');
  // 关闭弹层即清空返回栈（避免残留脏状态）
  NAVSTACK.length = 0;
  renderBackBtn();
}
function reloadView(){ var f = views[CUR]; if(f) f(); }
function toast(m, bad){
  var d = document.createElement('div');
  d.className = 'nov-toast';
  d.textContent = m;
  d.style.background = bad ? 'rgba(58,34,38,.94)' : 'rgba(31,42,34,.94)';
  d.style.color = bad ? '#e66a6a' : '#5ad18a';
  document.body.appendChild(d);
  // 出场动画由 CSS 负责；2.6s 后触发退场动画，再移除
  setTimeout(function(){
    d.classList.add('out');
    setTimeout(function(){ d.remove(); }, 260);
  }, 2600);
}
function statLine(t){ return '<span class="muted">'+esc(t)+'</span>'; }

/* ═══════════════════════════════════════════════════════════════
   动效与交互内核（2026-10-17 UI 重构）
   ═══════════════════════════════════════════════════════════════ */

/* ── 按钮 Loading 态：包一层，自动防连点 ── */
// 用法：await withBtn(el, '正在提交…', async () => {...})
async function withBtn(el, label, fn){
  if (!el) return fn();
  if (el.dataset.novBusy === '1') return;          // 已在跑，忽略重复点击
  el.dataset.novBusy = '1';
  var old = el.innerHTML;
  el.classList.add('nov-loading');
  el.innerHTML = '<span class="nov-spinner"></span>' + (label || '处理中…');
  try{
    return await fn();
  } finally {
    el.dataset.novBusy = '0';
    el.classList.remove('nov-loading');
    el.innerHTML = old;
  }
}

/* ── 导航栈（智能返回） ── */
var NAVSTACK = [];     // [{label, onBack}]
function pushNav(label, onBack){
  NAVSTACK.push({label:label, onBack:onBack});
  renderBackBtn();
}
function popNav(){
  var c = NAVSTACK.pop();
  renderBackBtn();
  return c;
}
function renderBackBtn(){
  var el = document.getElementById('shBack');
  if (!el) return;
  var top = NAVSTACK[NAVSTACK.length - 1];
  if (!top){ el.innerHTML = ''; return; }
  el.innerHTML = '';
  var b = document.createElement('button');
  b.className = 'sm ghost';
  b.textContent = '‹ ' + top.label;
  b.onclick = function(){ var c = popNav(); if (c && c.onBack) c.onBack(); };
  el.appendChild(b);
}

/* ── 结构化任务结果渲染（cardgen 的 JSON → 好看的列表） ── */
function renderTaskResult(raw){
  if (!raw || !String(raw).trim()) return '<p class="muted">（暂无结果）</p>';
  var d = null;
  try { d = JSON.parse(raw); } catch(e){ d = null; }

  // 非 JSON：按纯文本降级（保留换行）
  if (!d || typeof d !== 'object'){
    return '<pre style="font-size:12px;white-space:pre-wrap;word-break:break-word;'
         + 'background:#12151b;padding:10px;border-radius:8px;border:1px solid #232a35;'
         + 'max-height:300px;overflow:auto">' + esc(raw) + '</pre>';
  }

  var out = '';

  // ── cardgen 形态：{total, success, failed, results[], failures[], dry_run} ──
  if (typeof d.total === 'number' && (d.results || d.failures)){
    var total = d.total || 0;
    var okN = d.success || 0, failN = d.failed || 0;
    var finished = okN + failN;
    var pct = total ? Math.round(finished / total * 100) : 0;
    var isDone = (d.state === 'done' || d.state === 'partial' || (d.ok === true && finished >= total));

    out += '<div class="box" style="border-color:' + (isDone ? '#24503a' : '#2f4a5f') + '">'
        +  '<div class="k">进度</div>'
        +  '<div class="v" style="display:flex;align-items:baseline;gap:8px">'
        +    '<b class="nov-num" style="font-size:19px">' + finished + '</b>'
        +    '<span class="muted">/ ' + total + ' 张</span>'
        +    (d.dry_run ? '<span class="nov-badge pend" style="margin-left:auto">预演·未落盘</span>' : '')
        +  '</div>'
        +  '<div class="nov-prog' + (total ? '' : ' indet') + '"><i style="width:' + pct + '%"></i></div>'
        +  '<div class="muted" style="font-size:12px;display:flex;gap:14px">'
        +    '<span>✅ 成功 <b class="nov-num">' + okN + '</b></span>'
        +    '<span>❌ 失败 <b class="nov-num">' + failN + '</b></span>'
        +    (d.swept_placeholders ? '<span>🧹 清理 <b class="nov-num">' + d.swept_placeholders + '</b></span>' : '')
        +  '</div></div>';

    // 成功列表（stagger 入场）
    if (d.results && d.results.length){
      out += '<h3>已建成（' + d.results.length + '）</h3><div class="nov-stagger">';
      d.results.forEach(function(r){
        out += '<div class="nov-res ok">'
            +  '<span class="ic">✅</span>'
            +  '<span class="cd">' + esc(r.code || '') + '</span>'
            +  '<span class="nm">' + esc(r.name || r.path || '') + '</span>'
            +  '<span class="ch">' + (r.chars ? esc(r.chars) + ' 字' : '') + '</span>'
            +  '</div>';
      });
      out += '</div>';
    }

    // 失败列表
    if (d.failures && d.failures.length){
      out += '<h3 style="color:var(--bad)">失败（' + d.failures.length + '）</h3><div class="nov-stagger">';
      d.failures.forEach(function(f){
        out += '<div class="nov-res fail">'
            +  '<span class="ic">⚠</span>'
            +  '<span class="cd">' + esc(f.code || '') + '</span>'
            +  '<span class="nm" title="' + esc(f.why || '') + '">' + esc(f.why || '未知原因') + '</span>'
            +  '</div>';
      });
      out += '</div>';
    }

    if (d.error){ out += '<p class="err" style="font-size:12.5px">' + esc(d.error) + '</p>'; }
    return out;
  }

  // ── chapter_gen 形态：纯文本摘要 ──
  if (typeof raw === 'string' && raw.length < 400 && raw.indexOf('{') < 0){
    return '<div class="box"><div class="v" style="font-size:13px">' + esc(raw) + '</div></div>';
  }

  // ── 兜底：键值对美化 ──
  out += '<div class="box"><div class="k">结果字段</div><div class="v">';
  Object.keys(d).forEach(function(k){
    var v = d[k];
    if (v === null || v === undefined) return;
    if (Array.isArray(v) || typeof v === 'object'){
      out += '<div style="margin:4px 0"><span class="muted mono">' + esc(k) + '</span> = '
          +  '<code style="font-size:11.5px">' + esc(JSON.stringify(v)).slice(0, 300) + '</code></div>';
    } else {
      out += '<div style="margin:4px 0"><span class="muted mono">' + esc(k) + '</span> = '
          +  '<b>' + esc(String(v)) + '</b></div>';
    }
  });
  out += '</div></div>';
  return out;
}

/* ── 全局任务胶囊 ── */
var CAPS = { show:false, mode:'', text:'', sub:'', lastId:'' };
var CAPS_TIMER = null;
var CAPS_TICK = 0;

async function pollActive(){
  var d;
  try { d = await api('/api/tasks/active'); } catch(e){ return; }
  if (!d || typeof d.pending === 'undefined') return;

  var active = (d.pending || 0) + (d.running || 0);
  var el = document.getElementById('novCapsule');
  if (!el) return;

  if (active > 0){
    // 有活干：蓝色呼吸 + 流动条
    var it = (d.items && d.items[0]) || {};
    var label = '任务进行中';
    if (it.kind === 'cardgen'){
      label = '建卡 ' + (it.civ || '') + (it.total ? ' ' + (it.done||0) + '/' + it.total : '');
    } else if (it.kind === 'chapter_gen'){
      label = '正文 ' + (it.volume || '') + (it.chapter ? ' 第' + it.chapter + '章' : '');
    }
    var sub = (d.executor_alive ? '执行器运行中' : '排队 ' + active + ' 个') ;
    setCapsule('running', label, sub);
  } else if (d.last_done && d.last_done.id !== CAPS.lastId){
    // 刚跑完：绿/红提示，8 秒后收
    CAPS.lastId = d.last_done.id;
    var st = d.last_done.state;
    if (st === 'done') setCapsule('done', '任务已完成', '点此查看结果');
    else if (st === 'rejected') setCapsule('bad', '任务被拒绝', '点此查看原因');
    else setCapsule('bad', '任务失败', '点此查看原因');
    setTimeout(function(){
      CAPS.lastId = '';      // 允许下次同 id 再提示
      pollActive();
    }, 8000);
  } else if (!d.last_done){
    hideCapsule();
  } else {
    // 没活、也没新完成 → 收起来（但保留 lastId 防重复提示）
    hideCapsule();
  }
}

function setCapsule(mode, text, sub){
  var el = document.getElementById('novCapsule');
  if (!el) return;
  var key = mode + '|' + text + '|' + sub;
  if (el.dataset.key === key && el.classList.contains('show')) return;
  el.dataset.key = key;
  el.className = 'show ' + mode;
  el.innerHTML = '<span class="nov-dot"></span>'
    + '<span>' + esc(text) + '</span>'
    + (sub ? '<span class="nov-cap-num" style="font-size:11.5px;opacity:.72">' + esc(sub) + '</span>' : '')
    + '<span class="nov-flow"></span>';
  CAPS.show = true; CAPS.mode = mode;
}

function hideCapsule(){
  var el = document.getElementById('novCapsule');
  if (!el) return;
  el.classList.remove('show');
  CAPS.show = false;
}

function capsuleOpen(){
  if (CAPS.mode === 'done' || CAPS.mode === 'bad'){
    // 看结果
    if (CAPS.lastId) taskDetail(CAPS.lastId);
    else viewBoard();
    return;
  }
  // 进行中：直接开实时进度抽屉
  activeTaskSheet();
}

/* 进行中任务的实时抽屉 */
async function activeTaskSheet(){
  var d = await api('/api/tasks/active').catch(function(){ return null; });
  var items = (d && d.items) || [];
  if (!items.length){
    openSheet('后台任务', '<p class="muted">当前没有进行中的任务。</p>',
      '<button onclick="closeSheet()">关闭</button>');
    return;
  }
  var body = '<div class="nov-stagger">';
  items.forEach(function(t){
    var isCard = t.kind === 'cardgen';
    var title = isCard ? ('建卡 · ' + (t.civ || '?'))
                       : ('正文 · ' + (t.volume || '') + (t.chapter ? ' 第' + t.chapter + '章' : ''));
    var badge = t.state === 'running' ? '<span class="nov-badge run">执行中</span>'
              : t.state === 'blocked' ? '<span class="nov-badge pend">被锁</span>'
              : '<span class="nov-badge pend">排队</span>';
    var pct = (t.total ? Math.round((t.done||0) / t.total * 100) : 0);
    body += '<div class="item">'
         +  '<div class="r1"><span class="lay">' + esc(isCard ? 'cardgen' : 'chapter') + '</span>'
         +  '<span class="k">' + esc(title) + '</span>' + badge + '</div>'
         +  (t.total ? '<div class="nov-prog"><i style="width:' + pct + '%"></i></div>'
                       + '<div class="muted mono" style="font-size:12px">'
                       + (t.done||0) + ' / ' + t.total + ' 张'
                       + (t.current ? ' · 正在做 ' + esc(t.current) : '') + '</div>'
                     : '<div class="nov-prog indet"><i></i></div>')
         +  '</div>';
  });
  body += '</div>';
  if (d){
    body += '<p class="muted" style="font-size:12px">'
         +  '🔓 授权锁：' + (d.llm_unlocked ? '已解锁' : '已锁定') + '　'
         +  '⚙ 执行器：' + (d.executor_alive ? '运行中 (pid ' + d.executor_pid + ')' : '空闲')
         +  '</p>';
  }
  openSheet('后台任务', body,
    '<button class="sm" onclick="closeSheet();viewBoard()">打开任务看板</button>'
    + '<button onclick="closeSheet()">关闭</button>');
}

/* 启动轮询：有活 3 秒、没活 8 秒（省电） */
function startPolling(){
  if (CAPS_TIMER) clearInterval(CAPS_TIMER);
  var tick = function(){
    pollActive().finally(function(){
      var delay = CAPS.show ? 3000 : 8000;
      CAPS_TIMER = setTimeout(tick, delay);
    });
  };
  tick();
}

/* ── 页面切换淡入 ── */
function hAnimated(x){
  h(x);
  main.classList.remove('nov-enter');
  void main.offsetWidth;     // 强制 reflow，让动画能重播
  main.classList.add('nov-enter');
}


/* ══════ 极简 Markdown 渲染（让故事读起来不像原始表格） ══════ */
function md(src){
  var lines = String(src==null?'':src).replace(/\r\n?/g,'\n').split('\n');
  var out = [], i = 0;
  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return s;
  }
  function isTableRow(l){ return /^\s*\|.*\|\s*$/.test(l); }
  while (i < lines.length){
    var l = lines[i];
    // 表格
    if (isTableRow(l) && i+1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      var head = l.trim().replace(/^\||\|$/g,'').split('|').map(function(x){return x.trim();});
      i += 2;
      var rows = [];
      while (i < lines.length && isTableRow(lines[i])){
        rows.push(lines[i].trim().replace(/^\||\|$/g,'').split('|').map(function(x){return x.trim();}));
        i++;
      }
      out.push('<table><thead><tr>' + head.map(function(x){return '<th>'+inline(x)+'</th>';}).join('') + '</tr></thead><tbody>'
        + rows.map(function(r){ return '<tr>' + r.map(function(x){return '<td>'+inline(x)+'</td>';}).join('') + '</tr>'; }).join('')
        + '</tbody></table>');
      continue;
    }
    // 标题
    var mH = l.match(/^(#{1,4})\s+(.*)$/);
    if (mH){ out.push('<h'+Math.min(mH[1].length+1,6)+'>'+inline(mH[2])+'</h'+Math.min(mH[1].length+1,6)+'>'); i++; continue; }
    // 引用
    if (/^\s*>/.test(l)){
      var q = [];
      while (i < lines.length && /^\s*>/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      out.push('<blockquote>'+inline(q.join(' '))+'</blockquote>');
      continue;
    }
    // 列表
    if (/^\s*[-*+]\s+/.test(l)){
      var li = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])){ li.push(lines[i].replace(/^\s*[-*+]\s+/,'')); i++; }
      out.push('<ul>'+li.map(function(x){return '<li>'+inline(x)+'</li>';}).join('')+'</ul>');
      continue;
    }
    if (/^\s*\d+[.、]\s+/.test(l)){
      var lo = [];
      while (i < lines.length && /^\s*\d+[.、]\s+/.test(lines[i])){ lo.push(lines[i].replace(/^\s*\d+[.、]\s+/,'')); i++; }
      out.push('<ol>'+lo.map(function(x){return '<li>'+inline(x)+'</li>';}).join('')+'</ol>');
      continue;
    }
    // 分隔线
    if (/^\s*---+\s*$/.test(l)){ out.push('<hr style="border:none;border-top:1px solid var(--line);margin:14px 0">'); i++; continue; }
    // 空行
    if (!l.trim()){ i++; continue; }
    // 段落（合并连续行）
    var p = [l]; i++;
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|>\s*|[-*+]\s|\d+[.、]\s|---)/.test(lines[i]) && !isTableRow(lines[i])){
      p.push(lines[i]); i++;
    }
    out.push('<p>'+inline(p.join(' '))+'</p>');
  }
  return out.join('\n');
}

/* 从分卷大纲正文里抽出「小故事表」标题（### ① xxx），让用户先看到故事线而非字段表 */
function extractStoryTitles(src){
  var lines = String(src==null?'':src).replace(/\r\n?/g,'\n').split('\n');
  var out = [];
  for (var i=0;i<lines.length;i++){
    var m = lines[i].match(/^###\s*([①②③④⑤⑥⑦⑧⑨⑩⑪⑫]|\d+)?\s*(.+?)\s*$/);
    if (m){
      var t = m[2].trim();
      if (t.indexOf('总览')>=0) continue;
      // 过滤字段小节标题
      if (/^(谁|在哪|决定|后果|溯源|字段|内容)$/.test(t)) continue;
      out.push(t);
    }
  }
  return out;
}
/* 从正文里抽「在哪/遇谁/打谁/爱谁/成了什么/卷末跃迁」总览字段 */
function extractOverviewFields(src){
  var s = String(src==null?'':src);
  var got = {};
  var keys = ['在哪','遇谁','打谁·争什么','恩怨','爱恨','卷末跃迁'];
  keys.forEach(function(k){
    var re = new RegExp('\\*\\*'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\*\\*\\s*\\|\\s*([^|]+)\\|');
    var m = s.match(re);
    if (m) got[k] = m[1].trim();
  });
  return got;
}

/* key 前缀 → 中文分类（**已废弃**：2026-10-17 L4 修复，改为直接读后端 category 字段）。
   保留仅作 category 缺失时的兜底。 */
var L4CAT = [
  ['CHAR', '角色'], ['CIVI', '文明'], ['FACT', '势力'], ['EVNT', '事件'],
  ['FORE', '伏笔'], ['LOCA', '地点'], ['ITEM', '物品'], ['CAUS', '因果线'],
  ['ARTS', '功法技艺'], ['BLDG', '建筑'], ['TECH', '科技'], ['CULT', '文化'],
  ['PLAT', '力量体系'], ['TIME', '时间'], ['SYST', '系统规则'], ['RACE', '种族'],
  ['SKIL', '技艺'], ['EQUI', '装备'], ['PILL', '丹药'], ['MATE', '天材地宝'],
  ['PLAN', '修炼体系'], ['GHOS', '诡异'], ['RELA', '关系'], ['HIST', '历史']
];
/* 条目 → 分类：优先用后端返回的真实 category；缺失时才退回 key 前缀兜底。 */
function catOf(it){
  if (it && typeof it === 'object'){
    if (it.category && String(it.category).trim()) return String(it.category).trim();
    it = it.key;
  }
  var p = String(it||'').split('-')[0].toUpperCase();
  for (var i=0;i<L4CAT.length;i++){ if (L4CAT[i][0]===p) return L4CAT[i][1]; }
  return '其他';
}
/* 打开一张资料卡（查看/编辑） */
async function openItem(layer, key){
  try{
    var d = await api('/api/layers/'+encodeURIComponent(layer)+'/item/'+encodeURIComponent(key));
    var it = d.item||d||{};
    openSheet(key,
      '<p class="muted">'+esc(it.layer||layer)+' · '+esc(it.title||'')+' · '+esc(it.chars||'')+' 字</p>'
      + story(it.content||''),
      '<button onclick="closeSheet()">关闭</button>'
      + '<button onclick="editItem(\''+esc(layer)+'\',\''+esc(key)+'\')">编辑</button>');
  }catch(e){ toast(e.message||e, true); }
}
async function editItem(layer, key){
  try{
    var d = await api('/api/layers/'+encodeURIComponent(layer)+'/item/'+encodeURIComponent(key));
    var it = d.item||d||{};
    openSheet('编辑 '+key,
      '<label class="lbl">正文</label>'
      + '<textarea id="itc" style="min-height:56vh">'+esc(it.content||'')+'</textarea>',
      '<button onclick="closeSheet()">取消</button><button onclick="saveItem(\''+esc(layer)+'\',\''+esc(key)+'\')">保存</button>');

async function saveItem(layer, key){
  var c = document.getElementById('itc').value;
  if(!c.trim()){ toast('内容不能为空', true); return; }
  var r = await jput('/api/layers/'+encodeURIComponent(layer)+'/item/'+encodeURIComponent(key), {content:c});
  if(r && r.ok){ toast('已保存'); closeSheet(); viewL4(); } else toast((r&&r.error)||'保存失败', true);
}
var L4ALL = null;
async function viewL4(){
  try{
    await fetchLlmLock();
    // 2026-10-17 修复：全量拉取（all=true），并让缺 category 的旧缓存自动失效。
    if (!L4ALL || !L4ALL.length || typeof L4ALL[0].category === 'undefined'){
      var d = await api('/api/items?layer=L4&all=true');
      L4ALL = d.items||[];
    }
    var all = L4ALL;
    // 分类统计（基于**全量**数据，读真实 category）
    var counts = {};
    all.forEach(function(it){ var c = catOf(it); counts[c] = (counts[c]||0)+1; });

      + '<div class="box"><div class="k">资料总量</div><div class="v">'+all.length+' 张卡 · '+cats.length+' 个分类</div></div>'

        + '翻一翻「势力」「文明」卡：它们之间有没有历史恩怨、利益冲突、阵营对立？'
        + '这些就是 L1x 终极对抗的原料。</div></div>'
      + '<p class="row" style="margin-bottom:10px"><input id="l4q" placeholder="搜 key / 标题" style="flex:1" value="'+esc(L4.q)+'">'
+ '<button class="sm" onclick="L4.q=document.getElementById(\'l4q\').value;viewL4()">搜索</button></p>'
      + '<p class="row" style="margin:10px 0">'

/* ══════ 真实 LLM 授权锁 · 全局开关（2026-10-17） ══════ */
// 这是**文件锁** /sdcard/wogov_real_llm.allow 的面板视图。
// 与「二次门控 gate_l1/l2」（语义检视通路）完全不同，别混淆。
// 解锁 = touch（由人点开关），上锁 = rm（人点 或 真跑结束后自动）。
var LLMLOCK = {locked:true, unlocked:false, loaded:false};

async function fetchLlmLock(){
  try{
    var r = await api('/api/system/llm-lock');
    if (r && typeof r.locked !== 'undefined'){ LLMLOCK = r; LLMLOCK.loaded = true; }
    return LLMLOCK;
  }catch(e){
    LLMLOCK.loaded = true;
    return LLMLOCK;
  }
}

// 生成开关那一条 HTML（供各页面顶部复用）
function llmLockBar(){
  if (!LLMLOCK.loaded){
    return '<div class="box" id="llmLockBar"><div class="k">真实 LLM 授权锁</div>'
         + '<div class="v muted">读取中…</div></div>';
  }
  var on = !!LLMLOCK.unlocked;
  var bg = on ? '#1b5e20' : '#8e1b1b';
  var label = on ? '\ud83d\udd13 真实 LLM 授权锁（当前：已解锁）'
                 : '\ud83d\udd12 真实 LLM 授权锁（当前：已锁定）';
  return '<div id="llmLockBar" style="background:'+bg+';color:#fff;border-radius:10px;'
       + 'padding:12px 14px;margin:10px 0;cursor:pointer" onclick="toggleLlmLock()">'
       + '<div style="font-weight:700;font-size:15px">'+label+'</div>'
       + '<div style="font-size:12px;opacity:.9;margin-top:4px">'
       + (on ? '真跑可以外呼。跑完系统会自动上锁（也可现在点这里手动上锁）。'
             : '真跑会被拒绝。预演（real=false）不受影响，可随时跑。点这里可解锁。')
       + '</div></div>';
}

async function toggleLlmLock(){
  await fetchLlmLock();
  var on = !!LLMLOCK.unlocked;
  if (!on){
    // 解锁 → 二次确认（防误触）
    openSheet('\ud83d\udd13 解锁真实 LLM 授权锁',
      '<div class="box next"><div class="k">即将解锁真实外呼</div><div class="v" style="font-size:14px">'
      + '解锁后，<b>真跑</b>类任务（批量建卡 / L5 正文生成）会<b>真实调用 LLM 并写入磁盘</b>：'
      + '生成卡片正文（或正文段落）、写入 02_资料库、同步 materials / library_index / rel_edge。'
      + '<br><br>这会消耗 API 额度与时间（10 张卡约 10–30 分钟）。'
      + '<br>跑完系统会<b>自动上锁</b>；你也可以随时手动上锁。'
      + '</div></div>'
      + '<div class="box"><div class="k">当前文件</div><div class="v" style="font-size:12px">'
      + esc(LLMLOCK.file||'/sdcard/wogov_real_llm.allow')+'</div></div>',
      '<button onclick="doUnlockLlm()">确认解锁</button>'
      + '<button class="sm" onclick="closeSheet()">取消</button>');
  } else {
    // 上锁 → 确认
    openSheet('\ud83d\udd12 上锁真实 LLM 授权锁',
      '<div class="box"><div class="k">即将上锁</div><div class="v" style="font-size:14px">'
      + '上锁后，任何真跑任务都会被拒绝（预演不受影响）。'
      + '<br>如果当前有真跑正在跑，它会跑完但下次将被拒。</div></div>',
      '<button onclick="doLockLlm()">确认上锁</button>'
      + '<button class="sm" onclick="closeSheet()">取消</button>');
  }
}

async function doUnlockLlm(){
  var r = await jpost('/api/system/llm-lock/unlock', {});
  closeSheet();
  if (r && r.ok){
    toast('\ud83d\udd13 已解锁：真跑现在可用', false);
  } else {
    toast((r && (r.error||r.note)) || '解锁失败', true);
  }
  await fetchLlmLock();
  reloadView();
}

async function doLockLlm(){
  var r = await jpost('/api/system/llm-lock/lock', {});
  closeSheet();
  if (r && r.ok){
    toast('\ud83d\udd12 已上锁：真跑将被拒绝', false);
  } else {
    toast((r && (r.error||r.note)) || '上锁失败', true);
  }
  await fetchLlmLock();
  reloadView();
}

function cgPreset(){

    document.getElementById('cgNote').textContent = p.note;
  } else {
    document.getElementById('cgNote').textContent =
      '手动输入文明名与 spec（文明名要与资料库里的 sub_category 一致）';
  }
}

async function submitCardgen(real, btnEl){
  var civ = document.getElementById('cgCiv').value;
  var spec = document.getElementById('cgSpec').value;
  if (civ === '__other__'){
    civ = prompt('请输入文明名（须与资料库 sub_category 一致）','');
    if (!civ) return;
  }
  if (!spec) { toast('spec 不能为空', true); return; }

  // 真跑前先看锁
  if (real){
    await fetchLlmLock();
    if (!LLMLOCK.unlocked){
      openSheet('🔒 需要先解锁',
        '<div class="box next"><div class="k">真跑需要授权</div><div class="v" style="font-size:14px">'
        + '真跑会<b>真实调用 LLM 并写入磁盘</b>。<br>文明：<b>' + esc(civ) + '</b><br>规格：<span class="mono">'
        + esc(spec) + '</span><br><br>'
        + '当前授权锁<b>已锁定</b>，直接提交会被拒绝。<br>'
        + '点下面的按钮会：① 解锁 → ② 登记任务 → ③ 自动执行 → ④ 跑完自动上锁。'
        + '</div></div>',
        '<button class="warn" onclick="unlockThenSubmit(\'' + esc(civ).replace(/'/g,"\\'") + '\', \''
          + esc(spec).replace(/'/g,"\\'") + '\')">解锁并执行</button>'
        + '<button class="sm" onclick="submitCardgen(false)">改为预演</button>'
        + '<button class="ghost" onclick="closeSheet()">取消</button>');
      return;
    }
  }

  await doSubmitCardgen(civ, spec, real, btnEl);
}

/* 真正提交 —— 提交后**不关弹层**，原地变进度面板 */
async function doSubmitCardgen(civ, spec, real, btnEl){
  await withBtn(btnEl, real ? '提交中…' : '预演中…', async function(){
    var r = await jpost('/api/tasks/submit', {kind:'cardgen',
                        payload:{civ:civ, spec:spec, real:!!real}});
    if (!(r && r.ok)){
      toast((r && r.error) || '提交被拒', true);
      return;
    }
    // 原地变形：切到进度视图
    showCardgenProgress(r.id, civ, spec, real);

    // 立刻自动派发执行器（真跑和预演都自动跑，用户不用再去点）
    var dp = await jpost('/api/tasks/'+encodeURIComponent(r.id)+'/dispatch', {limit:1});
    if (dp && dp.ok){
      if (dp.already_running) toast('已有执行器在跑，任务将排队', false);
    } else {
      toast((dp && (dp.reason||dp.error)) || '执行器未启动', true);
    }
    // 开始轮询这个任务
    startCardgenPoll(r.id, civ, spec, real);
  });
}

/* 一键：解锁 → 提交 → 自动执行 */
async function unlockThenSubmit(civ, spec){
  var u = await jpost('/api/system/llm-lock/unlock', {});
  if (!u || !u.ok){ toast((u && (u.note||u.error)) || '解锁失败', true); return; }
  await fetchLlmLock();
  toast('🔓 已解锁，正在提交…', false);
  await doSubmitCardgen(civ, spec, true, null);
}

var CG_POLL = null;

function showCardgenProgress(tid, civ, spec, real){
  var tag = real ? '真跑' : '预演';
  var body =
      '<div class="box next"><div class="k">任务</div>'
    +   '<div class="v" style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">'
    +     '<b>' + esc(civ) + '</b>'
    +     '<span class="nov-badge ' + (real?'run':'pend') + '">' + tag + '</span>'
    +     '<span class="muted mono" style="font-size:11px;margin-left:auto">' + esc(tid) + '</span>'
    +   '</div>'
    +   '<div class="mono muted" style="font-size:11.5px;margin-top:5px">' + esc(spec) + '</div>'
    + '</div>'
    + '<div id="cgLive">'
    +   '<div class="nov-prog indet"><i></i></div>'
    +   '<p class="muted" style="text-align:center;font-size:13px">已提交，等待执行器接手…</p>'
    + '</div>'
    + '<div id="cgList"></div>'
    + '<p class="muted" id="cgLock" style="font-size:11.5px;margin-top:10px"></p>';

  openSheet('🏗 ' + civ + ' · ' + tag + '中', body,
      '<button class="sm" onclick="cgRunInBackground()">后台运行</button>'
    + '<button class="sm danger" id="cgAbort" onclick="cgAbort(\'' + esc(tid) + '\')">中止</button>');
}

function cgRunInBackground(){
  if (CG_POLL){ clearInterval(CG_POLL); CG_POLL = null; }
  closeSheet();
  toast('已转入后台，右下角胶囊可随时查看进度', false);
  setTimeout(pollActive, 300);
}

async function cgAbort(tid){
  var r = await api('/api/tasks/'+encodeURIComponent(tid), {method:'DELETE'}).catch(function(){return null;});
  if (CG_POLL){ clearInterval(CG_POLL); CG_POLL = null; }
  toast(r && r.canceled ? '已取消' : '取消请求已发出', !(r && r.canceled));
  refreshCardgenView(tid, null, null, null, true);
}

function startCardgenPoll(tid, civ, spec, real){
  if (CG_POLL) clearInterval(CG_POLL);
  var tick = async function(){
    var d = null;
    try { d = await api('/api/tasks/'+encodeURIComponent(tid)); } catch(e){ return; }
    if (!d || !d.state) return;
    // 弹层已关（后台运行）→ 停轮询，交给胶囊
    if (!sheet.classList.contains('open')){ clearInterval(CG_POLL); CG_POLL = null; return; }
    // 弹层标题被换成别的了（用户开了别的详情）→ 也停
    var title = document.getElementById('shTitle').textContent || '';
    if (title.indexOf(civ) < 0 && title.indexOf('建卡') < 0 && title.indexOf('文明') < 0){
      clearInterval(CG_POLL); CG_POLL = null; return;
    }
    refreshCardgenView(tid, civ, spec, real, false, d);
    if (['done','failed','rejected','canceled'].indexOf(d.state) >= 0){
      clearInterval(CG_POLL); CG_POLL = null;
      // 让胶囊也尽快更新
      setTimeout(pollActive, 350);
    }
  };
  CG_POLL = setInterval(tick, 2000);
  tick();
}

/* 刷新进度视图（局部更新，不重建整个弹层 —— 保证进度条能平滑过渡） */
function refreshCardgenView(tid, civ, spec, real, aborted, d){
  var live = document.getElementById('cgLive');
  var list = document.getElementById('cgList');
  var lockEl = document.getElementById('cgLock');
  if (!live || !list) return;

  if (!d){
    live.innerHTML = '<p class="muted" style="text-align:center">刷新中…</p>';
    return;
  }

  var st = d.state;
  var prog = null;
  try { prog = JSON.parse(d.result || '{}'); } catch(e){ prog = null; }

  var total = (prog && prog.total) || 0;
  var doneN = (prog && prog.done) || 0;
  var okN = (prog && prog.success) || 0;
  var failN = (prog && prog.failed) || 0;
  var finished = okN + failN;
  var pct = total ? Math.round(finished / total * 100) : 0;

  var finishedStates = ['done','failed','rejected','canceled'];
  var isFin = finishedStates.indexOf(st) >= 0;

  // ── 顶部进度 ──
  var badge = st === 'running' ? '<span class="nov-badge run">执行中</span>'
            : st === 'pending' ? '<span class="nov-badge pend">排队中</span>'

           +   '<span style="margin-left:auto">' + badge + '</span>'
           + '</div>';

  if (total){

         +  '</div>';

         +  (st === 'pending' ? '等待执行器接手…'
            : (prog && prog.current ? '正在生成 <span class="mono">' + esc(prog.current) + '</span>'
                                    : '生成中…'))
         +  '</p>';
  }
  live.innerHTML = head;

  // ── 结果列表（按 code 顺序，stagger） ──
  if (prog && (prog.results || prog.failures)){
    var rows = [];
    (prog.results || []).forEach(function(r){
      rows.push('<div class="nov-res ok"><span class="ic">✅</span>'
        + '<span class="cd">' + esc(r.code||'') + '</span>'

    (prog.failures || []).forEach(function(f){

    });
    list.innerHTML = rows.length
      ? '<div class="nov-stagger" style="margin-top:12px">' + rows.join('') + '</div>'
      : '';
  } else if (!isFin){
    list.innerHTML = '';
  }

  // ── 锁状态提示 ──
  if (lockEl){
    if (real){
      lockEl.innerHTML = isFin
        ? '🔒 真跑结束，授权锁已自动上锁'
        : '🔓 真跑进行中（授权锁已开，跑完自动上锁）';
    } else {
      lockEl.innerHTML = '安全预演：0 调 LLM、0 落盘';
    }
  }

  // ── 底部按钮：跑完换一套 ──
  var foot = document.getElementById('shFoot');
  if (foot && isFin){

      + '<button class="sm" onclick="cgViewCards(\'' + esc(tid) + '\')">查看新卡</button>'
      + '<button class="ghost" onclick="closeSheet()">关闭</button>';
  }

/* 触发执行（2026-10-17 重构：真派发）
 *
 * 【历史 bug】改造前这里是
 *     jpost('/api/tasks/{id}/result', {state:'running'})
 * 把任务从 pending 改成 running，而 exec_pending.py 只扫 pending
 * → 用户越点「触发执行」，任务越不可能被执行，永久僵死。
 *
 * 现在改为 POST /api/tasks/{id}/dispatch，服务端 spawn 执行器并立即返回，
 * 不改任务状态（保持 pending 让执行器扫到，状态由执行器回写）。
 */
async function runTask(id, btnEl){
  await withBtn(btnEl, '启动中…', async function(){
    var r = await jpost('/api/tasks/'+encodeURIComponent(id)+'/dispatch', {limit:1});
    if (r && r.ok){
      if (r.already_running){
        toast('已有执行器在跑（pid ' + r.pid + '），本轮不重复启动', false);
      } else {
        toast('执行器已启动（pid ' + r.pid + '），后台跑，不阻塞面板', false);
      }
      // 立刻轮询一次，让胶囊出现
      setTimeout(pollActive, 400);
      setTimeout(function(){ if (CUR === 'board') viewBoard(); }, 1500);
    } else {
      toast((r && (r.reason || r.error)) || '启动失败', true);
    }
  });
}var STATE_ZH = {pending:'待执行',blocked:'被锁',running:'执行中',done:'已完成',
                rejected:'被拒',failed:'失败',canceled:'已取消'};
var STATE_BADGE = {pending:'pend',blocked:'pend',running:'run',done:'done',
                   rejected:'bad',failed:'bad',canceled:'bad'};

async function taskDetail(id){
  try{
    var d = await api('/api/tasks/'+encodeURIComponent(id));
    var pl = d.payload || {};
    var st = d.state || '';
    var badge = STATE_BADGE[st] || 'pend';
    var title = (d.kind === 'cardgen')
      ? ('建卡 · ' + (pl.civ || '?'))
      : (d.kind === 'chapter_gen')
        ? ('正文 · ' + (pl.volume || '') + (pl.chapter ? ' 第'+pl.chapter+'章' : ''))
        : ('任务 · ' + (d.kind || ''));

    var body = ''
      + '<div class="box"><div class="k">状态</div><div class="v" style="display:flex;align-items:center;gap:9px">'
      +   '<span class="nov-badge '+badge+'" style="font-size:12.5px">'+esc(STATE_ZH[st]||st)+'</span>'
      +   '<span class="muted mono" style="font-size:11.5px">'+esc(id)+'</span>'
      + '</div></div>'
      + '<div class="box"><div class="k">参数</div><div class="v mono" style="font-size:12px">'
      +   esc(JSON.stringify(pl, null, 1)) + '</div></div>'
      + '<h3>结果</h3>' + renderTaskResult(d.result);

    var foot = '';
    if (st === 'pending'){
      foot += '<button class="primary" onclick="runTask(\''+esc(id)+'\', this)">立即执行</button>';
    }
    foot += '<button class="sm" onclick="closeSheet();viewBoard()">任务看板</button>'
          + '<button onclick="closeSheet()">关闭</button>';

    openSheet(title, body, foot);

    // 若从别处跳来（如建卡弹层），给个返回入口
    if (typeof TASK_BACK_FROM !== 'undefined' && TASK_BACK_FROM){
      pushNav(TASK_BACK_FROM.label, TASK_BACK_FROM.onBack);

}
