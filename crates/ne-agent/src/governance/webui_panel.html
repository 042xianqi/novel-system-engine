<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>world-gov 面板</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#2a2f3a;--fg:#d7dce5;--dim:#8b94a7;--acc:#5aa9e6;--warn:#e6b45a;--bad:#e66a6a;--ok:#5ad18a;--hdr:52px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    overscroll-behavior-y:none}
  /* ── 顶栏（移动优先：汉堡 + 标题 + 刷新） */
  #top{position:sticky;top:0;z-index:30;height:var(--hdr);display:flex;align-items:center;gap:10px;
    padding:0 12px;padding-top:env(safe-area-inset-top);background:var(--panel);border-bottom:1px solid var(--line)}
  #burger{font-size:20px;line-height:1;padding:8px 10px;border-radius:8px;background:#22303f;
    color:var(--acc);border:1px solid var(--line);cursor:pointer}
  #title{font-weight:600;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #reload{font-size:13px;padding:7px 11px;border-radius:8px;background:#22303f;color:var(--acc);
    border:1px solid var(--line);cursor:pointer}
  /* ── 抽屉菜单（默认隐藏，点击汉堡从左侧滑入） */
  #drawer{position:fixed;inset:0 auto 0 0;width:min(78vw,300px);z-index:50;
    background:var(--panel);border-right:1px solid var(--line);padding:14px 12px;
    padding-top:calc(14px + env(safe-area-inset-top));
    transform:translateX(-102%);transition:transform .22s ease;overflow-y:auto}
  #drawer.open{transform:translateX(0)}
  #mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
  #mask.open{display:block}
  #drawer h1{font-size:15px;margin:2px 0 14px;color:var(--acc)}
  #drawer a{display:flex;align-items:center;gap:8px;padding:12px 12px;margin:3px 0;border-radius:9px;
    color:var(--fg);text-decoration:none;cursor:pointer;font-size:15px}
  #drawer a:active{background:#20242e}
  #drawer a.active{background:#22303f;color:var(--acc);font-weight:600}
  #drawer a.slot{color:#5b6273;cursor:not-allowed}
  /* ── 主内容 */
  main{padding:14px 13px calc(28px + env(safe-area-inset-bottom));max-width:100%;overflow-x:hidden}
  h2{font-size:17px;margin:0 0 12px}
  h3{font-size:14px;margin:16px 0 8px;color:var(--acc)}
  /* ── 卡片（移动优先：竖排，代替表格） */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  .card .n{font-size:20px;color:var(--acc);font-weight:600;line-height:1.2}
  .card .l{color:var(--dim);font-size:11.5px;margin-top:3px}
  /* 条目卡片列表（窄屏主力形态） */
  .item{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;margin-bottom:9px}
  .item .r1{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
  .item .lay{background:#22303f;color:var(--acc);border-radius:5px;padding:1px 7px;font-size:11.5px;flex:none}
  .item .k{font-size:13px;color:var(--fg);font-weight:600;word-break:break-all}
  .item .t{font-size:12.5px;color:var(--dim);margin-bottom:7px;word-break:break-word}
  .item .acts{display:flex;gap:8px;flex-wrap:wrap}
  /* ── 表格（仅宽屏用；窄屏自动可横滚） */
  .tw{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px}
  table{width:100%;min-width:520px;border-collapse:collapse;background:var(--panel);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
  th{color:var(--dim);font-weight:400;background:#1b1f28}
  /* ── 控件（触控友好：最小 40px 高） */
  input,select,textarea{background:#1b1f28;color:var(--fg);border:1px solid var(--line);
    border-radius:9px;padding:10px 11px;font:inherit;min-height:42px;max-width:100%}
  textarea{width:100%;min-height:190px;font-family:ui-monospace,monospace;white-space:pre;overflow-wrap:normal;overflow-x:auto}
  button{background:#22303f;color:var(--acc);border:1px solid var(--line);border-radius:9px;
    padding:10px 14px;cursor:pointer;font:inherit;min-height:42px}
  button:active{background:#2a3b4f}
  button:disabled{opacity:.42;cursor:not-allowed}
  button.danger{color:var(--bad)}
  button.sm{padding:7px 11px;min-height:34px;font-size:12.5px}
  .muted{color:var(--dim);font-size:12px}
  .err{color:var(--bad)} .ok{color:var(--ok)} .warn{color:var(--warn)}
  pre{background:#12151b;border:1px solid var(--line);border-radius:10px;padding:11px;
    overflow:auto;max-height:330px;font-size:12px;white-space:pre;max-width:100%}
  .pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11.5px;border:1px solid var(--line)}
  .pill.on{color:#0f1115;background:var(--ok);border-color:var(--ok)}
  .pill.off{color:var(--dim)}
  .row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
  .row>*{max-width:100%}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .box .k{color:var(--dim);font-size:11px}
  .box .v{font-size:13px;margin-top:3px;word-break:break-all}
  /* ── 内联面板（不用 dialog：WebView 兼容性差） */
  #sheet{position:fixed;inset:0;z-index:60;display:none;overflow-y:auto;
    background:rgba(15,17,21,.97);padding:14px 13px calc(24px + env(safe-area-inset-bottom))}
  #sheet.open{display:block}
  #sheet .sh{position:sticky;top:0;display:flex;align-items:center;gap:10px;
    padding:10px 0 12px;background:rgba(15,17,21,.97);border-bottom:1px solid var(--line);margin-bottom:12px}
  #sheet .sh b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lbl{display:block;color:var(--dim);font-size:12px;margin:11px 0 5px}
  .two{display:grid;grid-template-columns:1fr;gap:10px}
  .three{display:grid;grid-template-columns:1fr;gap:10px}
  /* ── 宽屏（平板/桌面）：恢复双栏 */
  @media (min-width:760px){
    #top{height:auto;padding:12px 18px}
    #burger{display:none}
    #wrap{display:flex;min-height:100vh}
    #drawer{position:static;transform:none;width:206px;flex:none;transition:none;border-right:1px solid var(--line)}
    #mask{display:none!important}
    main{flex:1;padding:18px 22px}
    .two{grid-template-columns:1fr 1fr}
    .three{grid-template-columns:repeat(3,1fr)}
  }
</style>
</head>
<body>
<div id="top">
  <button id="burger" onclick="toggleNav()" aria-label="菜单">☰</button>
  <div id="title">漏斗总台</div>
  <select id="volSel" onchange="switchVolume(this.value)" style="min-height:34px;padding:4px 6px;font-size:12.5px">
    <option>卷01</option><option>卷02</option><option>卷03</option><option>卷04</option><option>卷05</option>
    <option>卷06</option><option>卷07</option><option>卷08</option><option>卷09</option><option>卷10</option>
  </select>
  <button id="reload" onclick="reloadView()">刷新</button>
</div>
  <button id="reload" onclick="reloadView()">刷新</button>
</div>
<div id="mask" onclick="toggleNav(false)"></div>
<div id="wrap">
  <nav id="drawer">
    <h1>《残响之河》</h1>
    <a data-v="funnel" class="active">漏斗总台</a>
    <a data-v="l0">L0 概括</a>
    <a data-v="l1">L1 总纲</a>
    <a data-v="l2">L2 分卷</a>
    <a data-v="l3">L3 细纲</a>
    <a data-v="l4">L4 资料</a>
    <a data-v="l5">L5 正文</a>
    <a data-v="gov">治理台</a>
    <a data-v="model">模型配置</a>
  </nav>
  <main id="main"><p class="muted">加载中…</p></main>
</div>
<div id="sheet">
  <div class="sh"><b id="shTitle">详情</b><button class="sm" onclick="closeSheet()">关闭</button></div>
  <div id="shBody"></div>
  <div id="shFoot" class="row" style="margin-top:16px"></div>
</div>
<script>
"use strict";
var main = document.getElementById('main');
var sheet = document.getElementById('sheet');
var CUR = 'overview';
function h(x){ main.innerHTML = x; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'"'}[c]; }); }
function api(p, opt){
  return fetch(p, Object.assign({headers:{'Accept':'application/json'}}, opt||{}))
    .then(function(r){ if(!r.ok){ if(r.status===400||r.status===404) return r.json(); throw new Error('HTTP '+r.status+' '+p); } return r.json(); });
}
function jpost(p, b){ return api(p, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b)}); }
function jput(p, b){ return api(p, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b)}); }
function jdel(p, b){
  var o = {method:'DELETE'};
  if(b){ o.headers={'Content-Type':'application/json'}; o.body=JSON.stringify(b); }
  return api(p, o);
}
function fail(e){ h('<h2>加载失败</h2><p class="err">'+esc(e.message||e)+'</p>'); }
function pid(on){ return on ? '<span class="pill on">OPEN</span>' : '<span class="pill off">LOCKED</span>'; }

function toggleNav(force){
  var d = document.getElementById('drawer'), m = document.getElementById('mask');
  var want = (typeof force === 'boolean') ? force : !d.classList.contains('open');
  d.classList.toggle('open', want);
  m.classList.toggle('open', want);
}
function openSheet(t, body, foot){
  document.getElementById('shTitle').textContent = t;
  document.getElementById('shBody').innerHTML = body;
  document.getElementById('shFoot').innerHTML = foot || '';
  sheet.classList.add('open');
  sheet.scrollTop = 0;
}
function closeSheet(){ sheet.classList.remove('open'); }
function reloadView(){ var f = views[CUR]; if(f) f(); }
function toast(m, bad){
  var d = document.createElement('div');
  d.textContent = m;
  d.style.cssText = 'position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);'
    + 'background:' + (bad?'#3a2226':'#1f2a22') + ';color:' + (bad?'#e66a6a':'#5ad18a')
    + ';padding:10px 15px;border-radius:10px;z-index:99;font-size:13.5px;border:1px solid #2a2f3a;max-width:90vw;text-align:center';
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 3000);
}
function tw(inner){ return '<div class="tw">' + inner + '</div>'; }
function itemCard(it){
  return '<div class="item">'
    + '<div class="r1"><span class="lay">'+esc(it.layer)+'</span><span class="k">'+esc(it.key)+'</span></div>'
    + '<div class="t">'+esc(it.title||'（无标题）')+' · '+esc(it.chars)+' 字'
      + (it.note_status ? ' · <span class="warn">'+esc(it.note_status)+'</span>' : '') + '</div>'
    + '<div class="acts">'
      + '<button class="sm" onclick="openItem(\''+esc(it.layer)+'\',\''+esc(it.key)+'\')">查看/编辑</button>'
      + '<button class="sm" onclick="quickTag(\''+esc(it.key)+'\')">打标签</button>'
    + '</div></div>';
}
/* ══════ 公共：卷号 / 跳转 / 文件读写 / 模型配置操作 ══════ */
var CURVOL = '\u537701';
function switchVolume(v){ CURVOL = v; reloadView(); }
function go(view){
  var a = document.querySelector('nav a[data-v="'+view+'"]');
  if(a) a.click();
}
function setTitle(t){ document.getElementById('title').textContent = t; }

/* 读文件（弹层预览） */
async function readFile(path){
  try{
    var d = await api('/api/pipeline/file?path='+encodeURIComponent(path));
    openSheet(path.split('/').pop()+' \u00b7 '+esc(d.chars)+' 字',
      '<pre>'+esc(d.content||'')+'</pre>',
      '<button onclick="closeSheet()">\u5173\u95ed</button><button onclick="editFile(\''+esc(path)+'\')">\u7f16\u8f91</button>');
  }catch(e){ toast(e.message||e, true); }
}
/* 编辑文件（全屏 textarea → PUT） */
async function editFile(path){
  try{
    var d = await api('/api/pipeline/file?path='+encodeURIComponent(path));
    openSheet('\u7f16\u8f91 '+path.split('/').pop(),
      statLine(path)+' \u00b7 '+esc(d.chars)+' \u5b57'
      + '<textarea id="fc" style="min-height:56vh;margin-top:10px">'+esc(d.content||'')+'</textarea>'
      + '<p class="muted">\u4fdd\u5b58\u524d\u4f1a\u81ea\u52a8\u5feb\u7167\uff0c\u5e76\u4fdd\u7559 .md.bak \u5907\u4efd\u3002</p>',
      '<button onclick="closeSheet()">\u53d6\u6d88</button><button onclick="saveFile(\''+esc(path)+'\')">\u4fdd\u5b58</button>');
  }catch(e){ toast(e.message||e, true); }
}
async function saveFile(path){
  var c = document.getElementById('fc').value;
  if(!c.trim()){ toast('\u5185\u5bb9\u4e0d\u80fd\u4e3a\u7a7a', true); return; }
  var r = await jput('/api/pipeline/file?path='+encodeURIComponent(path), {content:c});
  if(r && r.ok){ toast('\u5df2\u4fdd\u5b58\uff08\u5feb\u7167 '+String(r.snapshot_id).slice(0,8)+'\uff09'); closeSheet(); reloadView(); }
  else toast((r&&r.error)||'\u4fdd\u5b58\u5931\u8d25', true);
}
/* L4 卡编辑（复用 openItem，已存在） */
/* 模型配置操作 */
function llmBody(){
  var o={};
  var u=document.getElementById('lu').value.trim(); if(u) o.base_url=u;
  var m=document.getElementById('lm').value.trim(); if(m) o.model_id=m;
  var k=document.getElementById('lk').value; if(k) o.api_key=k;
  var b=document.getElementById('lb').value.trim(); if(b) o.default_backend=b;
  var t=document.getElementById('lt').value; if(t) o.max_resp_tokens=parseInt(t,10);
  var p=document.getElementById('lp').value; if(p) o.temperature=parseFloat(p);
  var r=document.getElementById('lr').value; if(r) o.max_retry=parseInt(r,10);
  return o;
}
async function llmTest(){
  var u=document.getElementById('lu').value.trim();
  if(!u){ toast('\u5148\u586b\u7aef\u70b9 URL', true); return; }
  var r = await jpost('/api/config/llm/test-connect', {base_url:u, model_id:(document.getElementById('lm')||{}).value||''});
  var el=document.getElementById('probe'); if(el) el.innerHTML='<pre>'+esc(JSON.stringify(r,null,1))+'</pre>';
  toast(r&&r.ok?'\u63a2\u6d4b\u901a\u8fc7':'\u63a2\u6d4b\u5931\u8d25', !(r&&r.ok));
}
async function llmSave(){ var r = await jput('/api/config/llm', llmBody()); toast(r.ok?'\u5df2\u4fdd\u5b58':((r&&r.error)||'\u5931\u8d25'), !r.ok); if(r.ok) viewModel(); }
async function llmReload(){ var r = await jpost('/api/config/llm/reload', {}); toast(r.ok?'\u5df2\u91cd\u8f7d':'\u91cd\u8f7d\u5931\u8d25', !r.ok); viewModel(); }
async function llmReset(){ if(!confirm('\u91cd\u7f6e\u4e3a\u9ed8\u8ba4 llm.toml\uff1f')) return;
  var r = await jpost('/api/config/llm/reset', {}); toast(r.ok?'\u5df2\u91cd\u7f6e':'\u91cd\u7f6e\u5931\u8d25', !r.ok); viewModel(); }

/* ══════ 统一样式助手（每页四段式） ══════ */
function segState(icon, title, lines){
  return '<div class="box" style="margin-bottom:10px"><div class="k">'+icon+' '+esc(title)+'</div>'
    + lines.map(function(l){ return '<div class="v">'+l+'</div>'; }).join('') + '</div>';
}
function segGate(items){
  if(!items || !items.length) return '';
  return '<div class="box" style="margin-bottom:10px"><div class="k">门禁结果</div>'
    + '<div class="v">' + items.join('　') + '</div></div>';
}
function segNext(text){
  return '<div class="box" style="margin-bottom:10px;border-color:#2f4a5f"><div class="k">\u23ed 下一步</div>'
    + '<div class="v">'+esc(text)+'</div></div>';
}
function ok(b){ return b ? '<span class="ok">\u2713</span>' : '<span class="bad">\u2717</span>'; }
function statLine(t){ return '<span class="muted">'+esc(t)+'</span>'; }

/* ══════ 页面① 漏斗总台 ══════ */
async function viewFunnel(){
  try{
    var r = await Promise.all([api('/api/pipeline/overview?volume='+encodeURIComponent(CURVOL)), api('/api/overview')]);
    var o=r[0], ov=r[1];
    var f = o.funnel||{}, m = o.materials||{}, c = o.chapters||{};
    var stages = (f.stages||[]).map(function(s){
      var dot = s.done ? '<span class="ok">\u25cf</span>' : '<span class="warn">\u25cb</span>';
      var target = {'L0':'l0','L1':'l1','L1x':'l1','L2':'l2','L3':'l3','L4':'l4','L5':'l5'}[s.id]||'';
      return '<div class="item" '+(target?'onclick="go(\''+target+'\')" style="cursor:pointer"':'')+'>'
        + '<div class="r1">'+dot+'<span class="lay">'+esc(s.id)+'</span><span class="k">'+esc(s.name)+'</span></div>'
        + '<div class="t">'+esc(s.status)+(s.file?(' \u00b7 '+esc(s.file)):'')+(s.dir?(' \u00b7 '+esc(s.dir)):'')+'</div>'
        + '</div>';
    }).join('');
    var nx = f.next||{};
    h('<h2>漏斗总台</h2>'
      + segState('\ud83d\udcca','漏斗进度',[ '<b style="font-size:19px">'+esc(f.progress||'-')+'</b> '+statLine('（'+esc(f.done||0)+' done / '+esc(f.total||0)+' 层）') ])
      + segNext((nx.action||'-')+'\n'+(nx.hint||''))
      + '<h3>层清单</h3><div>'+(stages||'<p class="muted">无</p>')+'</div>'
      + '<h3>全局</h3>'
      + '<div class="cards">'
      + '<div class="card"><div class="n">'+esc(ov.open_risks)+'</div><div class="l">未决风险</div></div>'
      + '<div class="card"><div class="n">'+esc((ov.snapshots||{}).count)+'</div><div class="l">快照</div></div>'
      + '<div class="card"><div class="n">'+esc(m.total_files)+'</div><div class="l">资料文件</div></div>'
      + '<div class="card"><div class="n">'+esc(c.progress||'-')+'</div><div class="l">正文 '+esc(CURVOL)+'</div></div>'
      + '</div>');
  }catch(e){ fail(e); }
}

/* ══════ 页面② L0 概括 ══════ */
async function viewL0(){
  try{
    var f = await api('/api/pipeline/funnel');
    var st = (f.stages||[]).find(function(x){ return x.id==='L0'; })||{};
    var d = await api('/api/pipeline/file?path='+encodeURIComponent('03_叙事规划/00_整本概括.md'));
    h('<h2>L0 整本概括</h2>'
      + segState(st.done?'\u2705':'\u25cb','层状态',[ esc(st.status||'-')+' '+ok(st.done), statLine('文件 '+esc(st.file||'-'))+' '+statLine(esc(d.chars)+' 字 / '+esc(d.lines)+' 行'), statLine('依赖 '+(st.deps||[]).join(' ')) ])
      + segNext(st.done?'该层已完成；下一层 L1 具体总纲。':'推进该层：补全概括内容。')
      + '<div class="row" style="margin-bottom:10px"><button onclick="editFile(\'03_叙事规划/00_整本概括.md\')">编辑</button>'
      + '<button onclick="reloadView()">重新读取</button></div>'
      + '<pre>'+esc(d.content||'')+'</pre>');
  }catch(e){ fail(e); }
}

/* ══════ 页面③ L1 总纲（含 L1x） ══════ */
var L1_TAB = '03_叙事规划/00_叙事总纲.md';
async function viewL1(){
  try{
    var f = await api('/api/pipeline/funnel');
    var st = (f.stages||[]).find(function(x){ return x.id==='L1'; })||{};
    var d = await api('/api/pipeline/file?path='+encodeURIComponent(L1_TAB));
    var T = [['03_叙事规划/00_叙事总纲.md','总纲'],['03_叙事规划/00_宏大对抗总规划.md','宏大对抗']];
    h('<h2>L1 总纲</h2>'
      + segState(st.done?'\u2705':'\u25cb','层状态',[ esc(st.status||'-')+' '+ok(st.done), statLine('依赖 '+(st.deps||[]).join(' ')) ])
      + '<div class="row" style="margin-bottom:10px">'

function jumpL3(){ var n=parseInt(document.getElementById('l3q').value,10); if(n>0) readL3(n); }
async function readL3(no){
  try{
    var d = await api('/api/pipeline/layer/L3/chapter/'+encodeURIComponent(CURVOL)+'/'+no);
    openSheet('第'+no+'章 · '+esc(d.chars)+' 字',
      '<pre>'+esc(d.content||'')+'</pre>',
      '<button onclick="closeSheet()">关闭</button><button onclick="editL3('+no+')">编辑</button>');
  }catch(e){ toast(e.message||e, true); }
}
async function editL3(no){
  try{
    var d = await api('/api/pipeline/layer/L3/chapter/'+encodeURIComponent(CURVOL)+'/'+no);
    openSheet('编辑第'+no+'章',
      '<label class="lbl">章节内容（必须以「### 第N章」开头）</label>'
      + '<textarea id="l3c" style="min-height:52vh">'+esc(d.content||'')+'</textarea>',
      '<button onclick="closeSheet()">取消</button><button onclick="saveL3('+no+')">保存</button>');
  }catch(e){ toast(e.message||e, true); }
}
async function saveL3(no){
  var c = document.getElementById('l3c').value;
  var r = await new Promise(function(res){
    fetch('/api/pipeline/layer/L3/chapter/'+encodeURIComponent(CURVOL)+'/'+no, {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({content:c})
    }).then(function(x){ return x.json(); }).then(res).catch(function(e){ res({error:String(e)}); });
  });
  if(r && r.ok){ toast('已保存（快照 '+String(r.snapshot_id).slice(0,8)+'）'); closeSheet(); viewL3(); }
  else toast((r&&r.error)||'保存失败', true);
}

function openNewCard(){
  openSheet('新建 L4 卡',
    '<label class="lbl">卡片编号 key</label><input id="nk" style="width:100%" placeholder="CHAR-99-0xx">'
    + '<label class="lbl">标题</label><input id="nt" style="width:100%">'
    + '<label class="lbl">正文</label><textarea id="nc" style="min-height:40vh"></textarea>'
    + '<p class="muted">写入 02_资料库/_webui/L4/；写前自动快照。</p>',
    '<button onclick="closeSheet()">取消</button><button onclick="doNewCard()">创建</button>');
}
async function doNewCard(){
  var k=document.getElementById('nk').value.trim();
  var c=document.getElementById('nc').value;
  if(!k||!c){ toast('key 与正文必填', true); return; }
  var r = await jpost('/api/layers/L4/items', {key:k, title:document.getElementById('nt').value.trim(), content:c});
  if(r.ok){ toast('已创建 '+k); closeSheet(); viewL4(); } else toast(r.error||'失败', true);
}

/* ══════ 页面⑦ L5 正文（流水线） ══════ */
async function viewL5(){
  try{
    var r = await Promise.all([
      api('/api/pipeline/chapters?volume='+encodeURIComponent(CURVOL)),
      api('/api/system/gate'),
      api('/api/tasks/list')
    ]);
    var c=r[0], g=r[1], t=r[2];

    var tasks = (t.tasks||[]).slice(0,5).map(function(x){
      return '<div class="item"><div class="r1"><span class="lay">'+esc(x.kind)+'</span><span class="k">'+esc(x.state)+'</span></div></div>';
    }).join('');

async function showInject(ch){
  try{
    var d = await api('/api/pipeline/inject?volume='+encodeURIComponent(CURVOL)+'&chapter='+ch);
    var b = d.blocks_summary||{};
    var rows = Object.keys(b).map(function(k){
      var v = b[k];
      var s = (typeof v==='object' && v!==null) ? JSON.stringify(v).slice(0,120) : String(v);
      return '<div class="item"><div class="r1"><span class="k">'+esc(k)+'</span></div><div class="t">'+esc(s)+'</div></div>';
    }).join('');
    openSheet('第'+ch+'章 注入包',
      '<p class="muted">'+esc(d.title||'')+' · '+esc(d.note||'')+'</p>'
      + '<h3>12 块摘要</h3><div>'+rows+'</div>'
      + '<h3>缺失引用（'+(d.missing_refs||[]).length+'）</h3>'
      + '<pre>'+esc(JSON.stringify(d.missing_refs||[], null, 1))+'</pre>',
      '<button onclick="closeSheet()">关闭</button>');
  }catch(e){ toast(e.message||e, true); }
}
async function checkChapter(ch){
  var r = await jpost('/api/pipeline/check', {volume:CURVOL, chapter:ch});
  if(!r || r.error){ toast((r&&r.error)||'检查失败', true); return; }
  var gates = (r.gates||[]).map(function(g){
    return '<div class="item"><div class="r1">'+(g.pass?'<span class="ok">\u2713</span>':'<span class="bad">\u2717</span>')+'<span class="k">'+esc(g.name)+'</span></div>'
      + (g.detail?'<div class="t">'+esc(String(g.detail).slice(0,160))+'</div>':'')+'</div>';
  }).join('');
  openSheet('第'+ch+'章 门禁 · '+esc(r.verdict),
    segGate([ 'P0 '+esc(r.p0_count||0)+' 条　P1 '+esc(r.p1_count||0)+' 条', statLine('字数 '+esc(r.words)+' / 跑 '+esc(r.gates_run)+' 道') ])
    + '<div>'+(gates||'<p class="muted">无</p>')+'</div>',
    '<button onclick="closeSheet()">关闭</button>');
}
async function genChapter(ch){
  var r = await jpost('/api/tasks/submit', {kind:'chapter_gen', payload:{volume:CURVOL, chapter:ch}});
  toast(r.ok?('已登记生成任务 '+r.id):(r.error||'被拒'), !r.ok);
  viewL5();
}
async function syncChapter(){
  var r = await jpost('/api/tasks/submit', {kind:'sync', payload:{volume:CURVOL}});
  toast(r.ok?('已登记落库任务 '+r.id):(r.error||'被拒'), !r.ok);
  viewL5();
}
