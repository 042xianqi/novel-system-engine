<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>world-gov 面板</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#d7dce5; --dim:#8b94a7; --acc:#5aa9e6; --warn:#e6b45a; --bad:#e66a6a; --ok:#5ad18a; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",monospace; background:var(--bg); color:var(--fg); }
  #wrap { display:flex; min-height:100vh; }
  nav { width:200px; background:var(--panel); border-right:1px solid var(--line); padding:12px; flex:none; }
  nav h1 { font-size:15px; margin:4px 0 12px; color:var(--acc); }
  nav a { display:block; padding:8px 10px; margin:2px 0; border-radius:6px; color:var(--fg); text-decoration:none; cursor:pointer; }
  nav a:hover { background:#20242e; }
  nav a.active { background:#22303f; color:var(--acc); }
  nav .slot { color:#5b6273; cursor:not-allowed; }
  main { flex:1; padding:18px 22px; overflow:auto; }
  h2 { font-size:17px; margin:0 0 14px; }
  h3 { font-size:14px; margin:18px 0 8px; color:var(--acc); }
  .cards { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:18px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 16px; min-width:130px; }
  .card .n { font-size:22px; color:var(--acc); }
  .card .l { color:var(--dim); font-size:12px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border-radius:8px; overflow:hidden; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--dim); font-weight:normal; background:#1b1f28; }
  tr:hover td { background:#1b1f28; }
  .tag { display:inline-block; background:#22303f; color:var(--acc); border-radius:4px; padding:0 6px; margin:0 3px 0 0; font-size:12px; }
  .st-suspect { color:var(--warn); } .st-critical { color:var(--bad); } .st-ok { color:var(--ok); }
  input,select,textarea { background:#1b1f28; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  textarea { width:100%; min-height:180px; font-family:monospace; }
  button { background:#22303f; color:var(--acc); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:hover { background:#2a3b4f; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.danger { color:var(--bad); }
  .muted { color:var(--dim); font-size:12px; }
  .err { color:var(--bad); }
  .ok { color:var(--ok); }
  .warn { color:var(--warn); }
  pre { background:#12151b; border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; max-height:340px; }
  .pill { display:inline-block; padding:1px 7px; border-radius:9px; font-size:11px; border:1px solid var(--line); }
  .pill.on { color:#0f1115; background:var(--ok); border-color:var(--ok); }
  .pill.off { color:var(--dim); }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .box .k { color:var(--dim); font-size:11px; }
  .box .v { font-size:13px; margin-top:2px; word-break:break-all; }
  dialog { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:0; max-width:760px; width:92%; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog .dh { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  dialog .db { padding:14px 16px; max-height:70vh; overflow:auto; }
  dialog .df { padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; }
  .lbl { display:block; color:var(--dim); font-size:12px; margin:10px 0 4px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .three { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
</style>
</head>
<body>
<div id="wrap">
  <nav>
    <h1>world-gov</h1>
    <a data-v="overview" class="active">工作台概览</a>
    <a data-v="items">条目浏览</a>
    <a data-v="queue">任务队列</a>
    <a data-v="archive">报告 &amp; 归档</a>
    <a data-v="tags">标签管理</a>
    <a data-v="snapshots">快照管理</a>
    <a data-v="categories">资料库分类管理</a>
    <a data-v="llm">LLM模型配置</a>
    <a class="slot" title="待第 16 批启用">沙箱入口（待启用）</a>
  </nav>
  <main id="main"><p class="muted">加载中…</p></main>
</div>

<dialog id="dlg">
  <div class="dh"><b id="dlgTitle">详情</b><button onclick="closeDlg()">关闭</button></div>
  <div class="db" id="dlgBody"></div>
  <div class="df" id="dlgFoot"></div>
</dialog>

<script>
"use strict";
var main = document.getElementById('main');
function h(x){ main.innerHTML = x; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'"'}[c]; }); }
function api(p, opt){
  return fetch(p, Object.assign({headers:{'Accept':'application/json'}}, opt||{}))
    .then(function(r){ if(!r.ok){ if(r.status===400||r.status===404) return r.json(); throw new Error('HTTP '+r.status+' '+p); } return r.json(); });
}
function jpost(p, b){ return api(p, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b)}); }
function jput(p, b){ return api(p, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b)}); }
function jdel(p, b){
  var o = {method:'DELETE'};
  if(b){ o.headers={'Content-Type':'application/json'}; o.body=JSON.stringify(b); }
  return api(p, o);
}
function fail(e){ h('<h2>加载失败</h2><p class="err">'+esc(e.message||e)+'</p>'); }
function pid(on){ return on ? '<span class="pill on">OPEN</span>' : '<span class="pill off">LOCKED</span>'; }
var dlg = document.getElementById('dlg');
function openDlg(t, body, foot){
  document.getElementById('dlgTitle').textContent = t;
  document.getElementById('dlgBody').innerHTML = body;
  document.getElementById('dlgFoot').innerHTML = foot || '<button onclick="closeDlg()">关闭</button>';
  if(!dlg.open) dlg.showModal();
}
function closeDlg(){ dlg.close(); }
function toast(m, bad){
  var d=document.createElement('div');
  d.textContent=m;
  d.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:'+(bad?'#3a2226':'#1f2a22')+';color:'+(bad?'#e66a6a':'#5ad18a')+';padding:8px 14px;border-radius:8px;z-index:99;font-size:13px;border:1px solid #2a2f3a';
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 3200);
}
/* ══════ 1. 工作台概览 ══════ */
async function viewOverview(){
  try{
    var r = await Promise.all([api('/api/overview'), api('/api/system/status'), api('/api/system/gate')]);
    var d=r[0], st=r[1], g=r[2];
    var g1 = st.gate_l1||{}, g2 = st.gate_l2||{};
    h('<h2>工作台概览</h2>'
      +'<div class="cards">'
      +'<div class="card"><div class="n">'+esc(d.library_index)+'</div><div class="l">库条目</div></div>'
      +'<div class="card"><div class="n">'+esc(d.open_risks)+'</div><div class="l">未决风险</div></div>'
      +'<div class="card"><div class="n">'+esc((d.cache||{}).entries)+'</div><div class="l">缓存项</div></div>'
      +'<div class="card"><div class="n">'+esc((d.queue||{}).pending)+'</div><div class="l">队列 Pending</div></div>'
      +'<div class="card"><div class="n">'+esc((d.snapshots||{}).count)+'</div><div class="l">快照</div></div>'
      +'<div class="card"><div class="n">'+esc((d.gate||{}).toolchain_epoch)+'</div><div class="l">toolchain epoch</div></div>'
      +'</div>'
      +'<p class="muted">门控状态：'+esc((d.gate||{}).status)+'</p>'
      +'<h3>外呼门控（两套并存，须各自满足）</h3>'
      +'<table><thead><tr><th>层级</th><th>条件</th><th>状态</th></tr></thead><tbody>'
      +'<tr><td>① 第一道闸</td><td>SEMANTIC_ENABLE_GATE && --semantic && NOVEL_SEMANTIC_UNLOCK=yes</td><td>'+pid(g1.open)+'</td></tr>'
      +'<tr><td>② 外呼锁</td><td>feature(real-semantic|llm_integration) && WOGOV_ALLOW_REAL_LLM=yes && --real-semantic</td><td>'+pid(g2.open)+'</td></tr>'
      +'</tbody></table>'
      +'<p class="muted">缓存占用 '+esc((d.cache||{}).total_bytes)+' bytes；只读视图。</p>');
  }catch(e){ fail(e); }
}

/* ══════ 2. 条目浏览（升级） ══════ */
var I = {layer:'', tag:'', sel:{}};
async function viewItems(){
  try{
    var r = await Promise.all([api('/api/layers/list'), api('/api/items?limit=100'
      + (I.layer?('&layer='+encodeURIComponent(I.layer)):'')
      + (I.tag?('&tag='+encodeURIComponent(I.tag)):''))]);
    var ly=r[0], it=r[1];
    var opts = '<option value="">全部层</option>' + (ly.canonical||[]).map(function(x){
      return '<option value="'+esc(x.layer)+'"'+(x.layer===I.layer?' selected':'')+'>'+esc(x.layer)+'（'+esc(x.meaning)+'）</option>';
    }).join('');
    var rows = (it.items||[]).map(function(x){
      return '<tr><td><input type="checkbox" data-k="'+esc(x.key)+'"'+(I.sel[x.key]?' checked':'')+' onchange="Isel(this)"></td>'
        +'<td>'+esc(x.layer)+'</td><td>'+esc(x.key)+'</td><td>'+esc(x.title)+'</td>'
        +'<td>'+esc(x.chars)+'</td><td>'+esc(x.note_status||'-')+'</td>'
        +'<td><button onclick="openItem(\''+esc(x.layer)+'\',\''+esc(x.key)+'\')">查看/编辑</button></td></tr>';
    }).join('');
    h('<h2>条目浏览</h2>'
      +'<p class="row"><select id="fl">'+opts+'</select> '
      +'<input id="ft" placeholder="按标签过滤" value="'+esc(I.tag)+'" style="width:150px"> '
      +'<button onclick="applyFilter()">筛选</button> '
      +'<button onclick="openNewItem()">新建条目</button> '
      +'<span class="muted">共 '+esc(it.count)+' 条</span></p>'
      +'<p class="row"><button onclick="batchTag()">批量打标签</button> '
      +'<button onclick="batchStatus()">批量标状态</button> '
      +'<button onclick="batchMove()">批量移动层</button> '
      +'<button class="danger" onclick="batchDelete()">批量删除</button> '
      +'<span class="muted" id="selcnt">已选 0</span></p>'
      +'<table><thead><tr><th></th><th>层</th><th>key</th><th>标题</th><th>字数</th><th>复核</th><th>操作</th></tr></thead>'
      +'<tbody>'+(rows||'<tr><td colspan="7" class="muted">无数据</td></tr>')+'</tbody></table>');
  }catch(e){ fail(e); }
}
function Isel(cb){
  if(cb.checked) I.sel[cb.dataset.k]=1; else delete I.sel[cb.dataset.k];
  var el=document.getElementById('selcnt'); if(el) el.textContent='已选 '+Object.keys(I.sel).length;
}
function selKeys(){ return Object.keys(I.sel); }
function applyFilter(){ I.layer=document.getElementById('fl').value; I.tag=document.getElementById('ft').value.trim(); viewItems(); }
function openNewItem(){
  openDlg('新建条目',
    '<label class="lbl">层级</label><select id="nl">'
    + ['L0','L1','L2','L3','L4','L5'].map(function(x){ return '<option>'+x+'</option>'; }).join('')+'</select>'
    +'<label class="lbl">key（不含斜杠）</label><input id="nk" style="width:100%" placeholder="WEBUI-001">'
    +'<label class="lbl">标题</label><input id="nt" style="width:100%">'
    +'<label class="lbl">正文</label><textarea id="nc"></textarea>'
    +'<p class="muted">写入 02_资料库/_webui/{层}/；写前自动快照。</p>',
    '<button onclick="closeDlg()">取消</button><button onclick="doNewItem()">创建</button>');
}
async function doNewItem(){
  var layer=document.getElementById('nl').value;
  var key=document.getElementById('nk').value.trim();
  var title=document.getElementById('nt').value.trim();
  var content=document.getElementById('nc').value;
  if(!key||!content){ toast('key 与正文必填', true); return; }
  var r = await jpost('/api/layers/'+encodeURIComponent(layer)+'/items', {key:key,title:title,content:content});
  if(r.ok){ toast('已创建 '+layer+'/'+key); closeDlg(); viewItems(); } else toast(r.error||'创建失败', true);
}
async function openItem(layer, key){
  try{
    var r = await Promise.all([api('/api/layers/'+encodeURIComponent(layer)+'/item/'+encodeURIComponent(key)),
                               api('/api/layers/'+encodeURIComponent(layer)+'/graph/'+encodeURIComponent(key))]);
    var d=r[0], g=r[1];
    if(d.error){ toast(d.error, true); return; }
    var rel = (g.related||[]).map(function(x){ return '<span class="tag">'+esc(x.layer)+'/'+esc(x.key)+'</span>'; }).join('') || '<span class="muted">无</span>';
    openDlg(layer+'/'+key,
      '<p class="muted">source: '+esc(d.source)+'　'+(d.file_exists?'<span class="ok">文件存在</span>':'<span class="warn">文件缺失</span>')+'　字数 '+esc(d.chars)+'</p>'
      +'<label class="lbl">标题</label><input id="et" style="width:100%" value="'+esc(d.title)+'">'
      +'<label class="lbl">正文</label><textarea id="ec">'+esc(d.content)+'</textarea>'
      +'<p class="muted">关联：'+rel+'</p>',
      '<button onclick="closeDlg()">关闭</button>'
      +'<button onclick="copyItem()">复制正文</button>'
      +'<button class="danger" onclick="delItem(\''+esc(layer)+'\',\''+esc(key)+'\')">删除</button>'
      +'<button onclick="saveItem(\''+esc(layer)+'\',\''+esc(key)+'\')">保存</button>');
  }catch(e){ toast(e.message||e, true); }
}
async function saveItem(layer, key){
  var r = await jput('/api/layers/'+encodeURIComponent(layer)+'/item/'+encodeURIComponent(key),
    {title:document.getElementById('et').value, content:document.getElementById('ec').value});
  if(r.ok){ toast('已保存（快照 '+String(r.snapshot_id).slice(0,8)+'）'); closeDlg(); viewItems(); } else toast(r.error||'保存失败', true);
}
async function delItem(layer, key){
  if(!confirm('确认删除 '+layer+'/'+key+'？（移到 09_冷备份）')) return;
  var r = await jdel('/api/layers/'+encodeURIComponent(layer)+'/item/'+encodeURIComponent(key));
  if(r.ok){ toast('已移入冷备份'); closeDlg(); viewItems(); } else toast(r.error||'删除失败', true);
}
function copyItem(){ var c=document.getElementById('ec'); c.select(); document.execCommand('copy'); toast('已复制'); }
async function batchTag(){
  var ks=selKeys(); if(!ks.length){ toast('先勾选', true); return; }
  var tag=prompt('标签：'); if(!tag) return;
  var r = await jpost('/api/layers/'+encodeURIComponent(I.layer||'L0')+'/batch', {action:'tag', keys:ks, tag:tag});
  toast(r.ok?('已打标签 '+r.tagged+' 条'):(r.error||'失败'), !r.ok);
  if(r.ok){ I.sel={}; viewItems(); }
}
async function batchStatus(){
  var ks=selKeys(); if(!ks.length){ toast('先勾选', true); return; }
  var st=prompt('状态：'); if(!st) return;
  var r = await jpost('/api/layers/'+encodeURIComponent(I.layer||'L0')+'/batch', {action:'status', keys:ks, status:st});
  toast(r.ok?('已更新 '+r.updated+' 条'):(r.error||'失败'), !r.ok);
  if(r.ok){ I.sel={}; viewItems(); }
}
async function batchMove(){
  var ks=selKeys(); if(!ks.length){ toast('先勾选', true); return; }
  var to=prompt('目标层（L0-L5）：'); if(!to) return;
  var r = await jpost('/api/layers/'+encodeURIComponent(I.layer||'L0')+'/batch', {action:'move', keys:ks, to_layer:to});
  toast(r.ok?('已移动 '+r.moved+' 条'):(r.error||'失败'), !r.ok);
  if(r.ok){ I.sel={}; viewItems(); }
}
async function batchDelete(){
  var ks=selKeys(); if(!ks.length){ toast('先勾选', true); return; }
  if(!confirm('确认批量删除 '+ks.length+' 条？')) return;
  var r = await jpost('/api/layers/'+encodeURIComponent(I.layer||'L0')+'/batch', {action:'delete', keys:ks});
  toast(r.ok?('已删除 '+r.deleted+' 条'):(r.error||'失败'), !r.ok);
  if(r.ok){ I.sel={}; viewItems(); }
}
/* ══════ 3. 任务队列（升级） ══════ */
async function viewQueue(){
  try{
    var r = await Promise.all([api('/api/queue'), api('/api/tasks/list'), api('/api/system/gate')]);
    var q=r[0], t=r[1], g=r[2];
    var rows = (t.tasks||[]).map(function(x){
      return '<tr><td>'+esc(x.id)+'</td><td>'+esc(x.kind)+'</td><td>'+esc(x.state)+'</td>'
        +'<td>'+(x.gate_l1?'<span class="ok">✓</span>':'<span class="bad">✗</span>')+'</td>'
        +'<td>'+(x.gate_l2?'<span class="ok">✓</span>':'<span class="bad">✗</span>')+'</td>'
        +'<td><button onclick="viewTask(\''+esc(x.id)+'\')">结果</button> '
        +'<button class="danger" onclick="cancelTask(\''+esc(x.id)+'\')">终止</button></td></tr>';
    }).join('');
    var dis = g.unlocked ? '' : 'disabled';
    h('<h2>任务队列</h2>'
      +'<p class="muted">双重门控：'+(g.unlocked?'<span class="ok">已解锁</span>':'<span class="warn">锁定（高危提交置灰）</span>')
      +'　① '+pid(g.gate_l1)+'　② '+pid(g.gate_l2)+'</p>'
      +'<h3>提交管线任务（高危，仅登记指令交 MCP 执行）</h3>'
      +'<p class="row"><select id="tk">'
      + ['scan','pipeline','semantic_pipeline','outline_rebuild','inspect_batch','cardgen','self_check','custom']
          .map(function(x){ return '<option>'+x+'</option>'; }).join('')
      +'</select> <input id="tv" placeholder="卷号（如 卷01，可空）" style="width:180px"> '
      +'<button '+dis+' onclick="submitTask()">提交任务</button>'
      +(g.unlocked?'':' <span class="muted">（锁未满足）</span>')+'</p>'
      +'<h3>已登记任务（'+esc(t.count)+'）</h3>'
      +'<table><thead><tr><th>id</th><th>kind</th><th>状态</th><th>闸①</th><th>闸②</th><th>操作</th></tr></thead>'
      +'<tbody>'+(rows||'<tr><td colspan="6" class="muted">空</td></tr>')+'</tbody></table>'
      +'<p class="muted">task_jobs（管线持久层）：'+esc(((q.jobs)||[]).length)+' 条</p>');
  }catch(e){ fail(e); }
}
async function submitTask(){
  var kind=document.getElementById('tk').value;
  var v=document.getElementById('tv').value.trim();
  var r = await jpost('/api/tasks/submit', {kind:kind, payload:(v?{volume:v}:{})});
  toast(r.ok?('已登记 '+r.id):(r.error||'被拒'), !r.ok);
  viewQueue();
}
async function viewTask(id){
  var r = await api('/api/tasks/'+encodeURIComponent(id)+'/result');
  openDlg('任务 '+id, '<pre>'+esc(JSON.stringify(r,null,1))+'</pre>');
}
async function cancelTask(id){
  var r = await jdel('/api/tasks/'+encodeURIComponent(id));
  toast(r.ok?'已终止':'终止失败', !r.ok);
  viewQueue();
}

/* ══════ 4. 报告 & 归档 ══════ */
async function viewArchive(){
  try{
    var d = await api('/api/archive');
    var rep = ((d.reports||{}).items||[]).map(function(r){
      return '<tr><td>'+esc(r.name)+'</td><td>'+esc(r.size)+'</td><td>'+esc(new Date(r.mtime*1000).toLocaleString())+'</td></tr>';
    }).join('');
    var pr = ((d.probe_archives||{}).items||[]).map(function(p){
      return '<tr><td>'+esc(p.name)+'</td><td>'+esc(p.size)+'</td></tr>';
    }).join('');
    h('<h2>报告 &amp; 归档</h2>'
      +'<p class="muted">审计报告 '+esc((d.reports||{}).count)+' 份；探针包 '+esc((d.probe_archives||{}).count)+' 个。</p>'
      +'<table><thead><tr><th>报告</th><th>bytes</th><th>时间</th></tr></thead><tbody>'+(rep||'<tr><td colspan="3" class="muted">无</td></tr>')+'</tbody></table>'
      +'<h3>探针包</h3><table><thead><tr><th>包</th><th>bytes</th></tr></thead><tbody>'+(pr||'<tr><td colspan="2" class="muted">无</td></tr>')+'</tbody></table>');
  }catch(e){ fail(e); }
}

/* ══════ 5. 标签管理（升级可写） ══════ */
async function viewTags(){
  try{
    var d = await api('/api/tags');
    var rows = (d.tags||[]).map(function(t){
      return '<tr><td>'+esc(t.key)+'</td><td><span class="tag">'+esc(t.tag)+'</span></td><td>'+esc(t.source)+'</td>'
        +'<td><button class="danger" onclick="rmTag(\''+esc(t.key)+'\',\''+esc(t.tag)+'\')">移除</button></td></tr>';
    }).join('');
    h('<h2>标签管理（'+esc(d.count)+'）</h2>'
      +'<p class="row"><input id="tk" placeholder="条目 key" style="width:180px"> '
      +'<input id="tt" placeholder="标签" style="width:160px"> '
      +'<button onclick="addTag()">添加标签</button></p>'
      +'<table><thead><tr><th>key</th><th>标签</th><th>来源</th><th>操作</th></tr></thead><tbody>'
      +(rows||'<tr><td colspan="4" class="muted">无</td></tr>')+'</tbody></table>');
  }catch(e){ fail(e); }
}
async function addTag(){
  var k=document.getElementById('tk').value.trim(), t=document.getElementById('tt').value.trim();
  if(!k||!t){ toast('key 与标签必填', true); return; }
  var r = await jpost('/api/items/'+encodeURIComponent(k)+'/tags', {tags:[t]});
  toast(r.ok?('已加标签 '+t):(r.error||'失败'), !r.ok);
  viewTags();
}
async function rmTag(k,t){
  var r = await jdel('/api/items/'+encodeURIComponent(k)+'/tags?tag='+encodeURIComponent(t));
  toast(r.ok?'已移除':(r.error||'失败'), !r.ok);
  viewTags();
}

/* ══════ 6. 快照管理（升级） ══════ */
async function viewSnapshots(){
  try{
    var d = await api('/api/audit/snapshots');
    var rows = (d.snapshots||[]).map(function(s){
      return '<tr><td>'+esc(String(s.snap_id).slice(0,16))+'</td><td>'+esc(s.label)+'</td>'
        +'<td>'+esc(new Date(s.created_ts*1000).toLocaleString())+'</td><td>'+esc(s.meta_bytes)+'</td>'
        +'<td><button onclick="pickSnap(\''+esc(s.snap_id)+'\')">选为 A</button></td></tr>';
    }).join('');
    h('<h2>快照管理（'+esc(d.count)+'）</h2>'
      +'<p class="row"><button onclick="createSnap()">创建快照</button> '
      +'<span class="muted" id="snapA">对比 A：未选</span></p>'
      +'<p class="muted">逻辑快照（只存索引+哈希）。创建/对比底层走 CLI <code>ne-agent snap create</code> / <code>diff show</code>。</p>'
      +'<table><thead><tr><th>snap_id</th><th>label</th><th>时间</th><th>bytes</th><th>操作</th></tr></thead><tbody>'
      +(rows||'<tr><td colspan="5" class="muted">无</td></tr>')+'</tbody></table>');
  }catch(e){ fail(e); }
}
var SNAP_A=null;
function pickSnap(id){ SNAP_A=id; document.getElementById('snapA').textContent='对比 A：'+String(id).slice(0,16); toast('已选 A'); }
function createSnap(){
  openDlg('创建快照',
    '<p class="muted">WebUI 不直接执行快照（避免绕过 CLI 校验）。请在终端执行：</p>'
    +'<pre>ne-agent snap create --label webui-$(date +%s) --work-root &lt;库根&gt;</pre>'
    +'<p class="muted">快照完成后点左侧「快照管理」刷新即可看到。</p>');
}

/* ══════ 7. 资料库分类管理【新增】 ══════ */
async function viewCategories(){
  try{
    var d = await api('/api/library/categories');
    var tree = (d.categories||[]).map(function(c){
      return '<tr><td>'+(c.parent_id?'└ ':'')+esc(c.name)+'</td><td>'+esc(c.descr)+'</td>'
        +'<td>'+esc(c.members)+'</td>'
        +'<td><button onclick="catDocs('+c.id+',\''+esc(c.name)+'\')">文档</button> '
        +'<button onclick="catRename('+c.id+',\''+esc(c.name)+'\')">改名</button> '
        +'<button onclick="catArchive('+c.id+')">归档</button> '
        +'<button class="danger" onclick="catDel('+c.id+',\''+esc(c.name)+'\')">删除</button></td></tr>';
    }).join('');
    h('<h2>资料库分类管理</h2>'
      +'<p class="row"><input id="cn" placeholder="新分类名" style="width:200px"> '
      +'<input id="cd" placeholder="描述（可空）" style="width:240px"> '
      +'<button onclick="catAdd()">新建分类</button></p>'
      +'<p class="muted">分类是纯运维元数据（不影响管线）；删除仅允许空分类。</p>'
      +'<table><thead><tr><th>分类</th><th>描述</th><th>文档数</th><th>操作</th></tr></thead>'
      +'<tbody>'+(tree||'<tr><td colspan="4" class="muted">还没有分类</td></tr>')+'</tbody></table>');
  }catch(e){ fail(e); }
}
async function catAdd(){
  var n=document.getElementById('cn').value.trim(), d=document.getElementById('cd').value.trim();
  if(!n){ toast('分类名必填', true); return; }
  var r = await jpost('/api/library/categories', {name:n, descr:d});
  toast(r.ok?('已创建 '+n):(r.error||'失败'), !r.ok);
  viewCategories();
}
async function catRename(id, old){ var n=prompt('新名称：', old); if(!n) return;
  var r = await jput('/api/library/categories/'+id, {name:n});
  toast(r.ok?'已改名':(r.error||'失败'), !r.ok); viewCategories(); }
async function catArchive(id){ var r = await jput('/api/library/categories/'+id, {archived:true});
  toast(r.ok?'已归档':(r.error||'失败'), !r.ok); viewCategories(); }
async function catDel(id,name){ if(!confirm('删除分类「'+name+'」？（仅空分类可删）')) return;
  var r = await jdel('/api/library/categories/'+id);
  toast(r.ok?'已删除':(r.error||'失败'), !r.ok); viewCategories(); }
async function catDocs(id,name){
  var r = await api('/api/library/categories/'+id);
  var rows=(r.docs||[]).map(function(x){
    return '<tr><td>'+esc(x.layer)+'</td><td>'+esc(x.key)+'</td><td>'+esc(x.title)+'</td><td>'+esc(x.chars)+'</td></tr>';
  }).join('');
  openDlg('分类「'+name+'」（'+esc(r.count)+'）',
    '<table><thead><tr><th>层</th><th>key</th><th>标题</th><th>字数</th></tr></thead><tbody>'
    +(rows||'<tr><td colspan="4" class="muted">无</td></tr>')+'</tbody></table>');
}

/* ══════ 8. LLM 模型配置【新增】 ══════ */
async function viewLlm(){
  try{
    var r = await Promise.all([api('/api/config/llm'), api('/api/system/gate'), api('/api/audit/op-logs?limit=20')]);
    var cfg=r[0], g=r[1], logs=r[2];
    var c=cfg.config||{}, eps=c.endpoints||{};
    var epRows = Object.keys(eps).map(function(k){
      var e=eps[k]||{};
      return '<tr><td>'+esc(k)+'</td>'
        +'<td>'+(e.base_configured?'<span class="ok">已配置</span>':'<span class="bad">未配置</span>')+'</td>'
        +'<td>'+(e.base_loopback?'<span class="ok">本机</span>':'<span class="warn">外部</span>')+'</td>'
        +'<td>'+(e.api_key_configured?'<span class="ok">已设置（掩码）</span>':'<span class="muted">无</span>')+'</td>'
        +'<td>'+esc(e.model_configured?'已配置':'缺')+'</td></tr>';
    }).join('');
    var logRows=(logs.logs||[]).filter(function(x){ return String(x.action).indexOf('llm')===0; })
      .map(function(x){ return '<tr><td>'+esc(x.time)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.detail)+'</td></tr>'; }).join('');
    h('<h2>LLM 模型配置</h2>'
      +'<p class="muted">配置文件：<code>'+esc(cfg.path)+'</code> '+(cfg.exists?'<span class="ok">已存在</span>':'<span class="warn">不存在（用默认值）</span>')+'</p>'
      +'<h3>当前配置（api-key 掩码）</h3>'
      +'<table><thead><tr><th>后端</th><th>地址</th><th>位置</th><th>API Key</th><th>模型</th></tr></thead><tbody>'
      +(epRows||'<tr><td colspan="5" class="muted">无</td></tr>')+'</tbody></table>'
      +'<div class="grid" style="margin-top:10px">'
      +'<div class="box"><div class="k">max_resp_tokens</div><div class="v">'+esc(c.max_resp_tokens)+'</div></div>'
      +'<div class="box"><div class="k">timeout_sec</div><div class="v">'+esc(c.timeout_sec)+'</div></div>'
      +'<div class="box"><div class="k">max_retry</div><div class="v">'+esc(c.max_retry)+'</div></div>'
      +'<div class="box"><div class="k">rps_limit</div><div class="v">'+esc(c.rps_limit)+'</div></div>'
      +'<div class="box"><div class="k">breaker_threshold</div><div class="v">'+esc(c.breaker_threshold)+'</div></div>'
      +'</div>'
      +'<h3>修改配置</h3>'
      +'<div class="two">'
      +'<div><label class="lbl">端点 URL</label><input id="lu" style="width:100%" placeholder="http://127.0.0.1:8788/v1"></div>'
      +'<div><label class="lbl">模型名称</label><input id="lm" style="width:100%" placeholder="glm-5.3-flash"></div>'
      +'</div><div class="two">'
      +'<div><label class="lbl">API Key（留空=不改）</label><input id="lk" type="password" style="width:100%"></div>'
      +'<div><label class="lbl">后端名</label><input id="lb" style="width:100%" value="openai_compat"></div>'
      +'</div><div class="three">'
      +'<div><label class="lbl">max_tokens</label><input id="lt" type="number" style="width:100%" value="'+esc(c.max_resp_tokens)+'"></div>'
      +'<div><label class="lbl">temperature</label><input id="lp" type="number" step="0.1" style="width:100%" placeholder="0.7"></div>'
      +'<div><label class="lbl">重试次数</label><input id="lr" type="number" style="width:100%" value="'+esc(c.max_retry)+'"></div>'
      +'</div><label class="lbl"><input type="checkbox" id="lj" checked> 强制 json response_format</label>'
      +'<p class="row" style="margin-top:12px">'
      +'<button onclick="llmTest()">测试连接</button>'
      +'<button onclick="llmSave()">保存配置</button>'
      +'<button onclick="llmReload()">重载配置</button>'
      +'<button class="danger" onclick="llmReset()">重置为默认</button></p>'
      +'<div id="probe" class="muted"></div>'
      +'<h3>门控状态</h3><p class="row">① '+pid(g.gate_l1)+'　② '+pid(g.gate_l2)+'</p>'
      +'<h3>最近配置修改审计</h3>'
      +'<table><thead><tr><th>时间</th><th>动作</th><th>详情</th></tr></thead><tbody>'
      +(logRows||'<tr><td colspan="3" class="muted">无</td></tr>')+'</tbody></table>');
  }catch(e){ fail(e); }
}
function llmBody(){
  var o={};
  var u=document.getElementById('lu').value.trim(); if(u) o.base_url=u;
  var m=document.getElementById('lm').value.trim(); if(m) o.model_id=m;
  var k=document.getElementById('lk').value; if(k) o.api_key=k;
  var b=document.getElementById('lb').value.trim(); if(b) o.default_backend=b;
  var t=document.getElementById('lt').value; if(t) o.max_resp_tokens=parseInt(t,10);
  var p=document.getElementById('lp').value; if(p) o.temperature=parseFloat(p);
  var r=document.getElementById('lr').value; if(r) o.max_retry=parseInt(r,10);
  o.response_format = document.getElementById('lj').checked;
  return o;
}
async function llmTest(){
  var u=document.getElementById('lu').value.trim();
  if(!u){ toast('先填端点 URL', true); return; }
  var r = await jpost('/api/config/llm/test-connect', {base_url:u, model_id:document.getElementById('lm').value.trim()});
  document.getElementById('probe').innerHTML='<pre>'+esc(JSON.stringify(r,null,1))+'</pre>';
  toast(r.ok?'探测通过（已校验格式）':'探测失败', !r.ok);
}
async function llmSave(){
  var r = await jput('/api/config/llm', llmBody());
  toast(r.ok?('已保存（备份 '+String(r.backup).split('/').pop()+'）'):(r.error||'失败'), !r.ok);
  if(r.ok) viewLlm();
}
async function llmReload(){ var r = await jpost('/api/config/llm/reload', {}); toast(r.ok?'已重载':'重载失败', !r.ok); viewLlm(); }
async function llmReset(){ if(!confirm('重置为默认 llm.toml 模板？')) return;
  var r = await jpost('/api/config/llm/reset', {}); toast(r.ok?'已重置':'重置失败', !r.ok); viewLlm(); }

/* ══════ 路由 ══════ */
var views = {overview:viewOverview, items:viewItems, queue:viewQueue, archive:viewArchive,
             tags:viewTags, snapshots:viewSnapshots, categories:viewCategories, llm:viewLlm};
Array.prototype.forEach.call(document.querySelectorAll('nav a[data-v]'), function(a){
  a.onclick = function(){
    Array.prototype.forEach.call(document.querySelectorAll('nav a'), function(x){ x.classList.remove('active'); });
    a.classList.add('active');
    views[a.dataset.v]();
  };
});
viewOverview();

</script>
