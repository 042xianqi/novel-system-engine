name: ci

# 目的：在**干净检出**上验证这棵树自洽。
# 本地有 target/ 缓存会掩盖"漏提交文件"这类问题——只有全新 checkout 才暴露。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 减小 CI 上的编译内存峰值
  CARGO_INCREMENTAL: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: 编译（全 workspace）
        run: cargo build --workspace --all-targets

      - name: 测试（全 workspace）
        run: cargo test --workspace
